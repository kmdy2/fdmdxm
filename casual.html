<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>休闲游戏 · 放电妹的仓库</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2340a060'/%3E%3Ctext x='16' y='22' font-family='Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='white' text-anchor='middle'%3E闲%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
<style>
  :root{
    --ink:#16181d;--ink-soft:#4a4f57;--ink-mute:#8a8f98;--line:#e6e8ec;
    --bg:#fbfbfc;--card:#ffffff;--brand:#40a060;--brand-deep:#2e7a48;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
    color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
    padding:16px 48px;background:rgba(251,251,252,.92);backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);box-shadow:0 1px 0 var(--line);
  }
  .logo{font-weight:900;font-size:18px;letter-spacing:.02em;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:10px}
  .logo-dot{width:10px;height:10px;border-radius:50%;background:var(--brand);display:inline-block}
  .logo small{font-weight:400;color:var(--ink-mute);font-size:12px;letter-spacing:.1em}
  .back-btn{
    display:inline-flex;align-items:center;gap:6px;padding:8px 16px;
    border:1px solid var(--line);border-radius:999px;background:#fff;
    color:var(--ink-soft);text-decoration:none;font-size:13px;transition:all .2s;
  }
  .back-btn:hover{border-color:var(--brand);color:var(--brand)}
  .page-head{padding:60px 48px 30px;max-width:1200px;margin:0 auto}
  .page-eyebrow{
    display:inline-flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.22em;
    color:var(--brand);text-transform:uppercase;margin-bottom:16px;font-weight:500;
  }
  .page-eyebrow::before{content:"";width:36px;height:1px;background:var(--brand)}
  .page-head h1{font-size:clamp(32px,5vw,56px);font-weight:900;letter-spacing:-.02em;margin-bottom:10px}
  .page-head p{color:var(--ink-mute);font-size:15px;max-width:560px}
  .games{padding:20px 48px 60px;max-width:1200px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
  .card{
    background:var(--card);text-decoration:none;color:inherit;display:block;
    transition:transform .3s ease, box-shadow .3s ease;border:1px solid var(--line);
  }
  .card:hover{transform:translateY(-6px);box-shadow:0 18px 40px -18px rgba(20,30,60,.25)}
  .cover{position:relative;overflow:hidden;background:#111}
  .cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
  .card:hover .cover img{transform:scale(1.05)}
  .card .cover{aspect-ratio:16/10}
  .play-badge{
    position:absolute;top:14px;right:14px;background:rgba(255,255,255,.95);color:var(--ink);
    padding:6px 14px;font-size:12px;letter-spacing:.12em;font-weight:500;
    display:flex;align-items:center;gap:6px;opacity:0;transform:translateY(-4px);transition:all .25s;
  }
  .card:hover .play-badge{opacity:1;transform:translateY(0)}
  .cover .genre{
    position:absolute;top:14px;left:14px;background:rgba(22,24,29,.75);color:#fff;
    padding:4px 10px;font-size:11px;letter-spacing:.14em;
  }
  .card-body{padding:18px 20px 22px}
  .card-body h3{font-size:18px;font-weight:700;line-height:1.25}
  .card-body p{font-size:13px;color:var(--ink-mute);margin-top:6px}
  footer{border-top:1px solid var(--line);padding:32px 48px;text-align:center;color:var(--ink-mute);font-size:13px}
  footer b{color:var(--brand)}
  @media (max-width:900px){
    header{padding:12px 24px}
    .page-head{padding:44px 24px 20px}
    .games{padding:10px 24px 50px}
    .grid{grid-template-columns:repeat(2,1fr);gap:20px}
    footer{padding:28px 24px}
  }
  @media (max-width:560px){
    .grid{grid-template-columns:1fr;gap:24px}
  }
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html"><span class="logo-dot"></span>放电妹的据点 <small>W A R E H O U S E</small></a>
  <a class="back-btn" href="index.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    返回首页
  </a>
</header>
<div class="page-head">
  <span class="page-eyebrow">CASUAL</span>
  <h1>休闲游戏</h1>
  <p>轻松上手，随玩随停，打发时间的好选择</p>
</div>
<section class="games">
  <div class="grid">
    <!-- 2048 -->
    <a class="card" href="2048/2048.html" target="_blank" rel="noopener">
      <div class="cover">
        <img src="" alt="2048">
        <span class="genre">休闲</span>
        <span class="play-badge">▶ 开始游戏</span>
      </div>
      <div class="card-body">
        <h3>2048</h3>
        <p>2048益智小游戏</p>
      </div>
    </a>
    <!-- 方神 -->
    <a class="card" href="yuansheng/yuansheng.html" target="_blank" rel="noopener">
      <div class="cover">
        <img src="tupian/yuansheng.jpg" alt="方神">
        <span class="genre">休闲</span>
        <span class="play-badge">▶ 开始游戏</span>
      </div>
      <div class="card-body">
        <h3>方神</h3>
        <p>大世界爽游</p>
      </div>
    </a>
    <!-- 方块世界 -->
    <a class="card" href="youxi/方块世界.html" target="_blank" rel="noopener">
      <div class="cover">
        <img src="tupian/方块世界.jpg" alt="方块世界">
        <span class="genre">休闲</span>
        <span class="play-badge">▶ 开始游戏</span>
      </div>
      <div class="card-body">

</section>
<footer>© 2026 <b>放电妹的仓库</b> · 休闲游戏分类</footer>
</body>
</html>
