<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>像素火影 · 忍者对决</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;overflow:hidden;}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#141c30 0%,#05070d 75%);font-family:"Courier New",monospace;touch-action:none;}
#wrap{position:relative;width:min(98vw,1100px);aspect-ratio:16/9;}
canvas{width:100%;height:100%;display:block;border-radius:8px;box-shadow:0 0 60px rgba(255,140,26,.22),0 0 0 2px rgba(255,180,60,.25);image-rendering:pixelated;touch-action:none;}

/* ═══ 移动端虚拟按键 ═══ */
#touch-controls{display:none;position:fixed;left:0;right:0;bottom:0;height:42vh;
 padding:8px 14px calc(14px + env(safe-area-inset-bottom,0));
 justify-content:space-between;align-items:flex-end;z-index:100;pointer-events:none;}
.tc-group{display:flex;align-items:flex-end;gap:10px;pointer-events:none;}
.tc-btn{width:58px;height:58px;border-radius:50%;
 background:rgba(255,255,255,0.10);border:2px solid rgba(255,220,150,0.45);
 color:#ffe9b0;font-family:"Courier New",monospace;font-weight:bold;font-size:13px;line-height:1.05;
 display:flex;align-items:center;justify-content:center;text-align:center;
 user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
 touch-action:none;backdrop-filter:blur(4px);pointer-events:auto;}
.tc-btn.active{background:rgba(255,180,60,0.5);transform:scale(0.94);}
.tc-dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px;}
.tc-dpad .up{grid-column:2;grid-row:1;}
.tc-dpad .left{grid-column:1;grid-row:2;}
.tc-dpad .down{grid-column:2;grid-row:2;}
.tc-dpad .right{grid-column:3;grid-row:2;}
.tc-actions{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px;}
.tc-actions .atk{grid-column:1;grid-row:1;background:rgba(220,70,40,0.28);}
.tc-actions .s1{grid-column:2;grid-row:1;}
.tc-actions .s2{grid-column:3;grid-row:1;}
.tc-actions .s3{grid-column:1;grid-row:2;}
.tc-actions .ult{grid-column:2 / span 2;grid-row:2;background:rgba(255,190,40,0.32);}
.tc-map{position:fixed;top:calc(8px + env(safe-area-inset-top,0));left:50%;transform:translateX(-50%);
 display:none;gap:10px;z-index:100;pointer-events:none;}
.tc-map .tc-btn{width:64px;height:38px;border-radius:8px;font-size:12px;pointer-events:auto;}

@media (max-width:900px), (pointer:coarse){
  #touch-controls{display:flex;}
  #wrap{width:100vw !important;aspect-ratio:16/9;}
  body{align-items:flex-start;}
  .tc-map.on{display:flex;}
}
@media (orientation:landscape) and (max-width:900px){
  #wrap{width:auto;height:100vh;aspect-ratio:16/9;}
  #touch-controls{height:auto;top:50%;bottom:auto;transform:translateY(-50%);padding:0 18px;align-items:center;}
  .tc-dpad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);}
  .tc-actions{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);}
  .tc-btn{width:48px;height:48px;font-size:12px;}
}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>

<!-- 移动端虚拟按键 -->
<div class="tc-map" id="tc-map">
  <div class="tc-btn" id="btn-map-prev">◀ 地图</div>
  <div class="tc-btn" id="btn-map-next">地图 ▶</div>
</div>
<div id="touch-controls">
  <div class="tc-group tc-dpad">
    <div class="tc-btn up"    id="btn-up">跳</div>
    <div class="tc-btn left"  id="btn-left">◀</div>
    <div class="tc-btn down"  id="btn-down">蹲</div>
    <div class="tc-btn right" id="btn-right">▶</div>
  </div>
  <div class="tc-group tc-actions">
    <div class="tc-btn atk"  id="btn-atk">攻</div>
    <div class="tc-btn s1"    id="btn-s1">技1</div>
    <div class="tc-btn s2"    id="btn-s2">技2</div>
    <div class="tc-btn s3"    id="btn-s3">技3</div>
    <div class="tc-btn ult"   id="btn-ult">奥义</div>
  </div>
</div>
<script>
const cvs=document.getElementById('c');
const ctx=cvs.getContext('2d');
const W=960,H=540,GROUND=462,GRAVITY=2000,WORLD_W=1600;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
const aabb=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;r=clamp(Math.round(r*(1+amt)),0,255);g=clamp(Math.round(g*(1+amt)),0,255);b=clamp(Math.round(b*(1+amt)),0,255);return `rgb(${r},${g},${b})`;}

/* ═══ 音频 ═══ */
let audioCtx=null,masterGain=null,_noiseBuf=null,audioEnabled=false;
function initAudio(){if(audioCtx)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=new AC();masterGain=audioCtx.createGain();masterGain.gain.value=0.32;masterGain.connect(audioCtx.destination);audioEnabled=true;}catch(e){audioCtx=null;}}
function getNoise(dur){if(!audioCtx)return null;if(!_noiseBuf||_noiseBuf.duration<dur){const sr=audioCtx.sampleRate;const len=Math.max(Math.floor(sr*Math.max(dur,0.5)),sr);_noiseBuf=audioCtx.createBuffer(1,len,sr);const d=_noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;}return _noiseBuf;}
function playOsc(freq,dur,type,vol,slideTo,delay){if(!audioCtx||!audioEnabled)return;const t0=audioCtx.currentTime+(delay||0);const osc=audioCtx.createOscillator();const g=audioCtx.createGain();osc.type=type||'square';osc.frequency.setValueAtTime(freq,t0);if(slideTo)osc.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t0+dur);g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(vol||0.15,t0+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);osc.connect(g);g.connect(masterGain);osc.start(t0);osc.stop(t0+dur+0.03);}
function playNoise(dur,vol,ff,ft,slideTo,delay){if(!audioCtx||!audioEnabled)return;const buf=getNoise(dur);if(!buf)return;const t0=audioCtx.currentTime+(delay||0);const src=audioCtx.createBufferSource();src.buffer=buf;const filt=audioCtx.createBiquadFilter();filt.type=ft||'bandpass';filt.frequency.setValueAtTime(ff||800,t0);if(slideTo)filt.frequency.exponentialRampToValueAtTime(Math.max(50,slideTo),t0+dur);filt.Q.value=1;const g=audioCtx.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(vol||0.15,t0+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);src.connect(filt);filt.connect(g);g.connect(masterGain);src.start(t0);src.stop(t0+dur+0.03);}

const EXTERNAL_SFX={
 chidori:{url:'audio/chidori.mp3',volume:0.90},rasengan:{url:'audio/rasengan.mp3',volume:0.90},
 katon:{url:'audio/katon.mp3',volume:0.85},amaterasu:{url:'audio/amaterasu.mp3',volume:0.90},
 water:{url:'audio/water.mp3',volume:0.80},sand:{url:'audio/sand.mp3',volume:0.80},
 clone:{url:'audio/clone_smoke.mp3',volume:0.85},jutsu_whoosh:{url:'audio/jutsu_whoosh.mp3',volume:0.75},
 kunai:{url:'audio/kunai.mp3',volume:0.60},taiko:{url:'audio/taiko.mp3',volume:0.95},
 drum_hit:{url:'audio/drum_hit.mp3',volume:0.90},sharingan:{url:'audio/sharingan.mp3',volume:0.85},
 byakugan:{url:'audio/byakugan.mp3',volume:0.80},susanoo:{url:'audio/susanoo.mp3',volume:0.90},
 gate_open:{url:'audio/gate_open.mp3',volume:0.95},finisher:{url:'audio/finisher.mp3',volume:1.00},
 hit_punch:{url:'audio/hit_punch.mp3',volume:0.75},hit_heavy:{url:'audio/hit_heavy.mp3',volume:0.90},
 block:{url:'audio/block.mp3',volume:0.70},hiraishin:{url:'audio/hiraishin.mp3',volume:0.85},
 kotoamatsukami:{url:'audio/kotoamatsukami.mp3',volume:0.90}
};
const _sfxBuffers={};let _sfxLoadAttempted=false;
function loadExternalSFX(){if(_sfxLoadAttempted||!audioCtx)return;_sfxLoadAttempted=true;for(const key of Object.keys(EXTERNAL_SFX)){const cfg=EXTERNAL_SFX[key];fetch(cfg.url).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.arrayBuffer();}).then(buf=>audioCtx.decodeAudioData(buf)).then(d=>{_sfxBuffers[key]=d;console.log('%c[SFX] ✓ '+key,'color:#4fc3f7');}).catch(()=>{console.log('%c[SFX] ✗ '+key+' 使用合成','color:#ff8c1a');});}}
function playExternal(key,fallbackFn){if(_sfxBuffers[key]&&audioCtx&&audioEnabled){const cfg=EXTERNAL_SFX[key];const src=audioCtx.createBufferSource();src.buffer=_sfxBuffers[key];const g=audioCtx.createGain();g.gain.value=cfg.volume||0.8;src.connect(g);g.connect(masterGain);try{src.start(0);}catch(e){if(fallbackFn)fallbackFn();}return true;}if(fallbackFn)fallbackFn();return false;}
function playExternalVar(key,fallbackFn,pitchVar){if(_sfxBuffers[key]&&audioCtx&&audioEnabled){const cfg=EXTERNAL_SFX[key];const src=audioCtx.createBufferSource();src.buffer=_sfxBuffers[key];src.playbackRate.value=1+rand(-(pitchVar||0.08),(pitchVar||0.08));const g=audioCtx.createGain();g.gain.value=(cfg.volume||0.8)*(0.85+Math.random()*0.15);src.connect(g);g.connect(masterGain);try{src.start(0);}catch(e){if(fallbackFn)fallbackFn();}return true;}if(fallbackFn)fallbackFn();return false;}

 ultKick(){playOsc(220,0.20,'square',0.16,60);playNoise(0.20,0.24,3400,'highpass',500);},

 finisher(){playOsc(140,1.20,'sawtooth',0.20,30);playOsc(280,1.20,'triangle',0.12,60,0.05);playNoise(1.20,0.24,1200,'lowpass',200);playOsc(1046,1.20,'sine',0.10,523,0.1);}
};
let hitSfxCd=0;
function updateSfxCd(dt){if(hitSfxCd>0)hitSfxCd-=dt;}
function resumeAudio(){initAudio();if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});if(audioCtx&&!_sfxLoadAttempted)loadExternalSFX();}

const MAPS=[

  {factor:0.10,draw(ox,t){ctx.fillStyle='rgba(255,255,255,.6)';for(let i=0;i<48;i++)ctx.fillRect(((i*73+ox*0.3)%(W+200)+W)%W,(i*41)%200,1,1);ctx.save();ctx.shadowBlur=70;ctx.shadowColor='rgba(255,215,150,0.55)';ctx.fillStyle='#ffeaa7';ctx.beginPath();ctx.arc(700+ox*0.25,108,58,0,Math.PI*2);ctx.fill();ctx.restore();ctx.fillStyle='rgba(255,255,255,.06)';for(let i=0;i<6;i++){const cx=(((i*250+t*8+ox)%(W+400))+W+400)%(W+400)-200,cy=40+i*30;ctx.beginPath();ctx.ellipse(cx,cy,60,10,0,0,Math.PI*2);ctx.fill();}}},

{id:'ame',name:'雨隐村',skyTop:'#0a0a14',skyMid:'#1a1a28',skyLow:'#2a2a3a',groundTop:'#181820',groundLow:'#080810',groundLine:'rgba(140,180,220,0.20)',grid:'rgba(255,255,255,0.03)',

class Fighter{
 constructor(cfg){
  this.char=cfg.char;this.isPlayer=!!cfg.isPlayer;this.pIndex=cfg.pIndex||0;
  this.x=cfg.x;this.y=GROUND;this.vx=0;this.vy=0;this.facing=cfg.facing||1;
  const st=this.char.stats;
  this.maxHp=st.hp;this.hp=this.maxHp;this.hpLag=1;this.maxChakra=100;this.chakra=0;
  this.baseSpeed=st.speed;this.speed=st.speed;this.jumpPower=st.jump;
  this.atkMul=st.atk;this.chakraMul=st.chakra;
  this.state='idle';this.animTime=0;this.move=null;this.moveKey=null;
  this.moveTime=0;this.moveProgress=0;this.hitDone=false;this.ultStage=0;this.multiTimer=0;
  this.onGround=true;this.hurtTime=0;this.invuln=0;this.flash=0;this.deadTime=0;
  this.guarding=false;this.aiTimer=0.8;this.foe=null;
  this.combo=0;this.comboTimer=0;this.guardBreak=0;this.wantsUkemi=false;this.superArmor=0;
  this.sealTime=0;this.rageBuff=0;
  this.auraOn=false;this.wasOnGround=true;this.stepCd=0;this.curPlatform=null;
  this.gateLevel=0;this.gateAuraT=0;
 }
 getHurtbox(){const h=this.guarding?96:108;return {x:this.x-22,y:this.y-h,w:44,h};}
 getHitbox(m){
  if(m.fx==='totsuka'){const cx=this.x+this.facing*(m.range/2+20);return {x:cx-m.range/2,y:this.y-124,w:m.range,h:56};}
  if(m.ult)return {x:this.x-m.range/2,y:this.y-150,w:m.range,h:150};
  const cx=this.x+this.facing*(m.range/2+8);return {x:cx-m.range/2,y:this.y-108,w:m.range,h:108};
 }
 canAct(){return this.state!=='dead'&&this.hurtTime<=0&&this.move===null&&this.sealTime<=0;}
 skillColor(key){if(key==='atk1'||key==='atk2'||key==='atk3')return '#ffe066';const sk=this.char.skills.find(s=>s.key===key);return sk?sk.color:'#ffe066';}
 skillByKey(key){return this.char.skills.find(s=>s.key===key)||COMBO[key]||null;}

  const m=this.skillByKey(key);if(!m)return false;

  const col=m.color||'#ffe066';
  if(key==='atk1'||key==='atk2'||key==='atk3')playExternalVar('hit_punch',()=>SFX.punch(),0.10);
  else if(m.ult){playExternal('taiko',()=>SFX.ultCharge());setTimeout(()=>playExternal('drum_hit',()=>{}),150);}
  else{
   const fx=m.fx;
   if(fx==='rasengan'||fx==='odama')playExternal('rasengan',()=>fx==='odama'?SFX.odama():SFX.rasengan());
   else if(fx==='chidori'||fx==='raikiri')playExternal('chidori',()=>SFX.lightning());
   else if(fx==='kageBunshin'||fx==='crowClone')playExternal('clone',()=>SFX.shadowClone());
   else if(fx==='gouryuuka'||fx==='greatFireball')playExternal('katon',()=>SFX.fireBig());
   else if(fx==='amaterasu')playExternal('amaterasu',()=>SFX.amaterasu());

   else if(fx==='gentleFist'||fx==='sixtyFour'||fx==='twinLion'||fx==='hinataUlt')playExternal('byakugan',()=>SFX.gentleFist());

   else if(fx==='cherryImpact'||fx==='cherryBloom')playExternal('hit_heavy',()=>SFX.hitBig());
   else if(fx==='healingPalm')SFX.heal();

 update(dt,foe){
  this.foe=foe;this.animTime+=dt;
  if(this.invuln>0)this.invuln-=dt;
  if(this.flash>0)this.flash-=dt;
  if(this.superArmor>0)this.superArmor-=dt;
  if(this.sealTime>0)this.sealTime-=dt;
  if(this.rageBuff>0)this.rageBuff-=dt;
  if(this.gateAuraT>0)this.gateAuraT-=dt;
  if(this.comboTimer>0){this.comboTimer-=dt;if(this.comboTimer<=0)this.combo=0;}
  if(this.stepCd>0)this.stepCd-=dt;
  if(!this.guarding&&this.hurtTime<=0)this.guardBreak=Math.max(0,this.guardBreak-dt*28);
  this.speed=this.getCurrentSpeed();
  const hpRatio=this.hp/this.maxHp;
  this.hpLag+=(hpRatio-this.hpLag)*Math.min(1,dt*4.5);
  if(this.hp<=0&&this.state!=='dead'){this.state='dead';this.move=null;this.vx=0;this.vy=-420;}
  if(this.state==='dead')this.deadTime+=dt;
  this.wasOnGround=this.onGround;
  const prevY=this.y;
  this.vy+=GRAVITY*dt;this.y+=this.vy*dt;
  const map=MAPS[currentMapIndex]||MAPS[0];
  const platforms=map.platforms||[];
  let onPlat=false;
  for(const pf of platforms){
   if(this.x+22>pf.x && this.x-22<pf.x+pf.w){
    if(prevY<=pf.y+2 && this.y>=pf.y && this.vy>=0){
     this.y=pf.y;this.vy=0;onPlat=true;
     if(!this.onGround && this.wasOnGround===false){SFX.land();spawnHitEffect(this.x,this.y,0,false,'rgba(255,220,150,0.7)',6);}
     break;
    }
   }
  }
  if(!onPlat){if(this.y>=GROUND){const wasAir=!this.wasOnGround;this.y=GROUND;this.vy=0;if(wasAir){SFX.land();spawnHitEffect(this.x,GROUND,0,false,'rgba(255,220,150,0.7)',8);}}}
  let nowGround=(this.y>=GROUND);
  if(!onPlat){for(const pf of platforms){if(Math.abs(this.y-pf.y)<1 && this.x+22>pf.x && this.x-22<pf.x+pf.w)nowGround=true;}}
  else nowGround=true;
  const wasOn=this.onGround;
  this.onGround=nowGround;
  if(this.onGround){
   if(this.state==='jump')this.state='idle';
   if(this.state==='hurt' && this.wantsUkemi && wasOn===false){
    this.wantsUkemi=false;
    this.hurtTime=Math.min(this.hurtTime,0.08);
    this.invuln=Math.max(this.invuln,0.35);
    this.vx*=0.5;
    spawnHitEffect(this.x,this.y-36,0,false,'#9ecbff',16);
    spawnDamageText(this.x,this.y-140,'受身','#9ecbff',22);
    SFX.whoosh();
   }
  }
  let fr;
  if(this.move)fr=0.03;
  else if(this.guarding)fr=0.0001;
  else if(this.onGround)fr=0.0005;
  else fr=0.30;
  this.vx*=Math.pow(fr,dt);
  if(Math.abs(this.vx)<4)this.vx=0;
  this.x+=this.vx*dt;
  this.x=clamp(this.x,62,WORLD_W-62);
  if(this.state==='run' && this.onGround && this.stepCd<=0){this.stepCd=0.22;SFX.step();}
  if(this.hurtTime>0){this.hurtTime-=dt;if(this.hurtTime<=0&&this.state==='hurt')this.state='idle';}
  if(this.move){
   this.moveTime+=dt;
   this.moveProgress=this.moveTime/this.move.dur;
   const m=this.move;
   if(m.ult){
    const stgs=ULT_STAGES[this.char.id];
    if(stgs && this.ultStage<stgs.length){
     if(this.moveTime>=stgs[this.ultStage].t){
      const stg=stgs[this.ultStage].s;
      this.ultStage++;
      this.spawnSkillFX(m.key,m,m.color,stg);
     }
    }
   }
   if(m.multi){
    if(this.moveTime>=m.hitStart){
     this.multiTimer-=dt;
     if(this.multiTimer<=0){this.multiTimer=m.multiInterval||0.10;this.tryHit(foe,m);}
    }
   } else {
    if(this.moveTime>=m.hitStart && this.moveTime<=m.hitEnd && m.hitEnd>0){
     if(!this.hitDone)this.tryHit(foe,m);
    }
   }
   if(this.moveProgress>=1){
    this.move=null;this.moveProgress=0;this.ultStage=0;
    if(this.state!=='dead'&&this.state!=='hurt'){this.state=this.onGround?'idle':'jump';}
   }
  }
  if(this.canAct() && this.onGround && Math.abs(this.vx)<30){
   if(foe&&foe.state!=='dead')this.facing=foe.x>this.x?1:-1;
  }
 }
}

function handleInput(f,inp,buf,dt){
 if(!f||f.state==='dead')return;
 if(f.sealTime>0){f.guarding=false;return;}
 if(f.hurtTime>0){if(!f.onGround && (inp.down||buf.up>0)){f.wantsUkemi=true;if(buf.up>0)buf.up=0;}f.guarding=false;return;}
 const busy=f.move!==null;
 if(!busy && f.onGround && inp.down){f.guarding=true;f.state='guard';f.vx*=Math.pow(0.008,dt);return;}
 if(f.guarding){f.guarding=false;if(f.state==='guard')f.state='idle';}
 let dir=0;
 if(inp.left)dir--;
 if(inp.right)dir++;
 if(!busy && f.onGround){if(dir!==0){f.vx=dir*f.speed;f.state='run';f.facing=dir;}else if(f.state==='run'){f.state='idle';}}
 else if(!busy && !f.onGround && dir!==0){f.vx+=dir*1250*dt;}
 if(buf.up>0 && f.onGround && !busy){buf.up=0;f.vy=-f.jumpPower;f.onGround=false;f.state='jump';SFX.jump();}
 if(buf.atk>0){
  if(!busy){buf.atk=0;f.startMove('atk1');}
  else if(f.moveKey==='atk1'&&f.moveProgress>0.32){buf.atk=0;f.startMove('atk2');}
  else if(f.moveKey==='atk2'&&f.moveProgress>0.32){buf.atk=0;f.startMove('atk3');}
 }
 if(buf.s1>0&&!busy&&f.onGround&&f.startMove('s1'))buf.s1=0;
 if(buf.s2>0&&!busy&&f.onGround&&f.startMove('s2'))buf.s2=0;
 if(buf.s3>0&&!busy&&f.onGround&&f.startMove('s3'))buf.s3=0;
 if(buf.ult>0&&!busy&&f.onGround&&f.startMove('ult'))buf.ult=0;
}
function updateAI(f,foe,dt){
 if(!f||f.state==='dead'||f.hurtTime>0)return;
 if(f.sealTime>0)return;
 if(f.move)return;
 const dx=foe.x-f.x,adx=Math.abs(dx);
 f.facing=dx>0?1:-1;
 f.aiTimer-=dt;
 const guardP=1-Math.pow(1-0.55,dt);
 if(foe.move && adx<135 && Math.random()<guardP){f.guarding=true;f.state='guard';f.vx*=0.7;return;}
 f.guarding=false;
 if(adx>122){f.vx=Math.sign(dx)*f.speed*0.93;if(f.onGround)f.state='run';}
 else if(adx<54){f.vx=-Math.sign(dx)*f.speed*0.62;if(f.onGround)f.state='run';}
 else{f.vx*=0.72;if(f.onGround)f.state='idle';
  if(f.aiTimer<=0){f.aiTimer=rand(0.34,0.95);const r=Math.random();
   if(f.chakra>=100&&r<0.38)f.startMove('ult');
   else if(f.chakra>=44&&r<0.55)f.startMove('s3');
   else if(f.chakra>=30&&r<0.72)f.startMove('s2');
   else if(f.chakra>=22&&r<0.88)f.startMove('s1');
   else f.startMove('atk1');
  }
 }
}

function resolveHazards(dt){
 for(const h of hazards){
  if(!h.owner)continue;
  const foe=h.owner===p1?p2:p1;
  if(!foe||foe.state==='dead')continue;
  if(h.pull){const dx=h.x-foe.x,dy=h.y-(foe.y-54);const d=Math.hypot(dx,dy);if(d<220&&d>0.001){const power=h.pullPower||900;foe.vx+=(dx/d)*power*dt;foe.vy+=(dy/d)*power*0.45*dt;}}
  if(h.type==='amaterasu'){if(foe.invuln<=0&&Math.abs(foe.x-h.x)<h.r&&foe.onGround){h.dmgTick=(h.dmgTick||0)+dt;if(h.dmgTick>0.20){h.dmgTick=0;const dmg=Math.max(1,Math.round(20*h.owner.getCurrentAtk()));foe.hp=Math.max(0,foe.hp-dmg);foe.flash=0.08;spawnDamageText(foe.x,foe.y-140,dmg,'#a06bff',20);if(foe.hp<=0){foe.state='dead';foe.vy=-420;}}}}
 }
}

function drawWorld(){
 const m=MAPS[currentMapIndex]||MAPS[0];
 const grads=getMapGrads(m);
 const camOff=-camX;
 ctx.fillStyle=grads.sky;ctx.fillRect(0,0,W,GROUND);
 for(const layer of m.layers)layer.draw(-camX*layer.factor,time);
 ctx.save();ctx.translate(camOff,0);
 ctx.fillStyle=grads.ground;ctx.fillRect(0,GROUND,WORLD_W,H-GROUND);
 ctx.fillStyle=m.groundLine;ctx.fillRect(0,GROUND,WORLD_W,3);
 ctx.strokeStyle=m.grid;ctx.lineWidth=1;
 for(let i=0;i<14;i++){const y=GROUND+12+i*6;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(WORLD_W,y);ctx.stroke();}
 ctx.fillStyle='rgba(255,200,100,0.15)';ctx.fillRect(0,GROUND-2,4,GROUND*0.4);ctx.fillRect(WORLD_W-4,GROUND-2,4,GROUND*0.4);
 const pfs=m.platforms||[];
 for(const pf of pfs){
  ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(pf.x,pf.y+pf.h,pf.w,6);
  const pg=ctx.createLinearGradient(pf.x,pf.y,pf.x,pf.y+pf.h);
  pg.addColorStop(0,'#4a5568');pg.addColorStop(1,'#2a3140');
  ctx.fillStyle=pg;ctx.fillRect(pf.x,pf.y,pf.w,pf.h);
  ctx.fillStyle='rgba(255,220,150,0.35)';ctx.fillRect(pf.x,pf.y,pf.w,2);
  ctx.strokeStyle='rgba(255,255,255,0.06)';
  for(let i=1;i<5;i++){ctx.beginPath();ctx.moveTo(pf.x+i*(pf.w/5),pf.y);ctx.lineTo(pf.x+i*(pf.w/5),pf.y+pf.h);ctx.stroke();}
 }
 ctx.restore();
 if(m.weather)m.weather(time);
}
function drawShadows(){
 for(const f of [p1,p2]){
  if(!f)continue;
  let footY=GROUND;
  const m=MAPS[currentMapIndex]||MAPS[0];
  for(const pf of (m.platforms||[])){if(Math.abs(f.y-pf.y)<2 && f.x+22>pf.x && f.x-22<pf.x+pf.w){footY=pf.y;break;}}
  const h=f.y-footY;
  const sc=clamp(1+h/300,0.42,1);
  ctx.save();ctx.globalAlpha=0.34*sc;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(f.x,footY+5,27*sc,8*sc,0,0,Math.PI*2);ctx.fill();ctx.restore();
 }
}

function drawHealthBar(x,y,w,h,f,rightAlign){
 const r=clamp(f.hp/f.maxHp,0,1);

 ctx.save();
 ctx.shadowBlur=12;ctx.shadowColor='rgba(255,100,50,.5)';
 ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(x-3,y-3,w+6,h+6);

 const lw=w*lag,lx=rightAlign?x+w-lw:x;
 ctx.fillStyle='rgba(255,225,130,0.8)';ctx.fillRect(lx,y,lw,h);
 const fw=w*r,fx=rightAlign?x+w-fw:x;
 ctx.fillStyle=GRAD.hp;ctx.fillRect(fx,y,fw,h);
 ctx.fillStyle='rgba(255,255,255,0.3)';ctx.fillRect(fx,y,fw,h*0.36);

 if(gb>0){const gw=w*gb;const gx=rightAlign?x+w-gw:x;const g2=ctx.createLinearGradient(0,y+h+2,0,y+h+6);g2.addColorStop(0,'#ffb84d');g2.addColorStop(1,'#ff3030');ctx.fillStyle=g2;ctx.fillRect(gx,y+h+2,gw,4);}
 if(f.sealTime>0){ctx.fillStyle='#c0392b';ctx.fillRect(x,y-8,w,4);}
 ctx.strokeStyle='rgba(255,200,110,0.8)';ctx.lineWidth=1.5;ctx.strokeRect(x-1.5,y-1.5,w+3,h+3);
 ctx.restore();
 const hpNow=Math.max(0,Math.round(f.hp));
 ctx.save();ctx.font='bold 14px "Courier New",monospace';ctx.textAlign=rightAlign?'left':'right';ctx.textBaseline='middle';
 const tx=rightAlign?(x+w+14):(x-14);const ty=y+h/2+1;

 ctx.restore();

/* ═══ 滚动式选人界面 ═══ */
const CARD_W=150,CARD_H=250,CARD_GAP=20;
const VIEW_X=60,VIEW_W=W-120,VIEW_Y=140;
let selScrollX=0;
const cardSpacing=CARD_W+CARD_GAP;

function cardScreenX(i){return VIEW_X+i*cardSpacing-selScrollX;}
function cardTargetScroll(focusIdx){
  const center=focusIdx*cardSpacing+CARD_W/2;
  const maxScroll=Math.max(0,CHARACTERS.length*cardSpacing-CARD_GAP-VIEW_W);
  return clamp(center-VIEW_W/2,0,maxScroll);
}
function updateSelectScroll(dt){
  const focusIdx=!sel.lock1?sel.p1:(sel.p2);
  const target=cardTargetScroll(focusIdx);
  selScrollX += (target-selScrollX)*Math.min(1,dt*10);
}

let previewFighters=null;
function getPreview(i){
 if(!previewFighters)previewFighters=[];
 if(!previewFighters[i])previewFighters[i]=new Fighter({char:CHARACTERS[i],isPlayer:true,pIndex:1,x:0,y:0,facing:1});
 return previewFighters[i];
}

function drawSelectScreen(){
 ctx.fillStyle=GRAD.select;ctx.fillRect(0,0,W,H);

 /* 顶部标题 */
 ctx.textAlign='center';ctx.save();ctx.shadowBlur=26;ctx.shadowColor='#ff8c1a';
 ctx.fillStyle='#ffd93b';ctx.font='bold 26px "Courier New",monospace';ctx.fillText('选 择 忍 者',W/2,38);ctx.restore();

 /* 地图选择面板 */
 const mpW=380,mpH=34;
 const mpX=(W-mpW)/2,mpY=58;
 ctx.fillStyle='rgba(10,16,28,0.92)';rrect(mpX,mpY,mpW,mpH,8);ctx.fill();
 ctx.strokeStyle='rgba(255,217,59,0.6)';ctx.lineWidth=1.6;rrect(mpX,mpY,mpW,mpH,8);ctx.stroke();
 ctx.font='bold 15px "Courier New",monospace';ctx.fillStyle='rgba(255,217,59,0.85)';
 ctx.textAlign='left';ctx.fillText('◄ Q',mpX+12,mpY+23);
 ctx.textAlign='right';ctx.fillText('E ►',mpX+mpW-12,mpY+23);
 ctx.textAlign='center';ctx.font='bold 11px "Courier New",monospace';ctx.fillStyle='rgba(255,255,255,0.45)';
 ctx.fillText('对 战 地 图',W/2,mpY+13);
 ctx.font='bold 14px "Courier New",monospace';ctx.fillStyle='#ffffff';
 ctx.fillText(MAPS[sel.mapIndex].name,W/2,mpY+28);

 /* 指示点 */
 const dotY=mpY+mpH+8,dotSpacing=12;
 const dotTotal=(MAPS.length-1)*dotSpacing;
 for(let i=0;i<MAPS.length;i++){const dx=W/2-dotTotal/2+i*dotSpacing;ctx.beginPath();ctx.arc(dx,dotY,i===sel.mapIndex?3.5:2,0,Math.PI*2);ctx.fillStyle=i===sel.mapIndex?'#ffd93b':'rgba(255,255,255,0.3)';ctx.fill();}

 /* ── 滚动卡片区域 ── */
 ctx.save();
 ctx.beginPath();ctx.rect(0,VIEW_Y-10,W,H-VIEW_Y+10);ctx.clip();

 updateSelectScroll(1/60);

 for(let i=0;i<CHARACTERS.length;i++){
  const sx=cardScreenX(i);
  if(sx+CARD_W<-20||sx>W+20)continue;
  const ch=CHARACTERS[i];
  const isP1=sel.p1===i,isP2=sel.p2===i;
  const centerX=W/2;
  const cardCenter=sx+CARD_W/2;
  const distFromCenter=Math.abs(cardCenter-centerX);
  const highlight=clamp(1-distFromCenter/(VIEW_W/2),0.55,1);

  ctx.save();
  ctx.translate(cardCenter,VIEW_Y+CARD_H/2);
  const sc=0.88+highlight*0.12;
  ctx.scale(sc,sc);
  ctx.translate(-CARD_W/2,-CARD_H/2);

  ctx.fillStyle='rgba(16,24,42,0.94)';rrect(0,0,CARD_W,CARD_H,10);ctx.fill();
  let borderCol='rgba(255,255,255,0.10)';
  if(isP1&&isP2)borderCol='#c060ff';
  else if(isP1)borderCol='#5fb8ff';
  else if(isP2)borderCol='#ff5a5a';
  ctx.strokeStyle=borderCol;ctx.lineWidth=(isP1||isP2)?3:1.5;
  rrect(0,0,CARD_W,CARD_H,10);ctx.stroke();
  if(isP1||isP2){ctx.save();ctx.globalAlpha=0.15+0.10*Math.sin(time*6);ctx.fillStyle=borderCol;rrect(0,0,CARD_W,CARD_H,10);ctx.fill();ctx.restore();}

  const pf=getPreview(i);
  pf.animTime=time+i*1.7;pf.state='idle';pf.move=null;pf.x=0;pf.y=0;pf.facing=1;
  ctx.save();ctx.translate(CARD_W/2,195);ctx.scale(0.92,0.92);drawFighter(pf);ctx.restore();

  ctx.textAlign='center';ctx.font='bold 14px "Courier New",monospace';ctx.fillStyle='#fff';
  ctx.fillText(ch.name,CARD_W/2,215);
  ctx.font='bold 10px "Courier New",monospace';ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.fillText(ch.tag,CARD_W/2,232);

  for(let k=0;k<4;k++){ctx.fillStyle=ch.skills[k].color;ctx.globalAlpha=0.85;ctx.fillRect(CARD_W/2-42+k*22,CARD_H-14,16,4);ctx.globalAlpha=1;}

  if(isP1){ctx.font='bold 11px "Courier New",monospace';ctx.fillStyle='#5fb8ff';
   ctx.fillText(sel.lock1?'◆ 1P 已确认':'1P',CARD_W/2,-6);}
  if(isP2){ctx.font='bold 11px "Courier New",monospace';ctx.fillStyle='#ff5a5a';
   ctx.fillText(sel.lock2?'◆ 2P 已确认':(mode==='pve'?'CPU':'2P'),CARD_W/2,CARD_H+16);}

  ctx.restore();
 }
 ctx.restore();

 /* ── 左右箭头提示 ── */
 ctx.save();ctx.globalAlpha=0.4+0.3*Math.abs(Math.sin(time*3));
 ctx.fillStyle='#ffffff';ctx.font='bold 32px "Courier New",monospace';
 if(selScrollX>2){ctx.textAlign='left';ctx.fillText('‹',8,VIEW_Y+CARD_H/2);}
 const maxScroll=Math.max(0,CHARACTERS.length*cardSpacing-CARD_GAP-VIEW_W);
 if(selScrollX<maxScroll-2){ctx.textAlign='right';ctx.fillText('›',W-8,VIEW_Y+CARD_H/2);}
 ctx.restore();

 /* ── 滚动条 ── */
 const barY=H-46;
 const barX=W/2-150,barW=300,barH=4;
 ctx.fillStyle='rgba(255,255,255,0.12)';rrect(barX,barY,barW,barH,2);ctx.fill();
 const thumbW=Math.max(40,barW*VIEW_W/(CHARACTERS.length*cardSpacing));
 const thumbX=barX+(barW-thumbW)*(selScrollX/Math.max(1,maxScroll));
 ctx.fillStyle='rgba(255,217,59,0.85)';rrect(thumbX,barY,thumbW,barH,2);ctx.fill();

 /* ── 底部操作提示 ── */
 ctx.textAlign='center';ctx.font='bold 12px "Courier New",monospace';
 ctx.fillStyle='rgba(95,184,255,0.9)';ctx.fillText('1P: A/D 选择   J 确认   K 取消',260,H-22);
 if(mode==='pvp'){ctx.fillStyle='rgba(255,90,90,0.9)';ctx.fillText('2P: ←/→ 选择   小键盘 1 确认   2 取消',700,H-22);}
 else{ctx.fillStyle='rgba(255,90,90,0.65)';ctx.fillText('2P: 电脑自动选择',700,H-22);}

 if(sel.lock1&&sel.lock2){ctx.save();ctx.globalAlpha=0.6+0.4*Math.abs(Math.sin(time*8));ctx.font='bold 32px "Courier New",monospace';ctx.fillStyle='#ffd93b';ctx.textAlign='center';ctx.fillText('战 斗 开 始',W/2,H-68);ctx.restore();}
}

 ctx.textAlign='center';ctx.save();ctx.shadowBlur=34;ctx.shadowColor='#ff8c1a';
 ctx.fillStyle='#ffd93b';ctx.font='bold 68px "Courier New",monospace';ctx.fillText('像 素 火 影',W/2,166);ctx.restore();
 ctx.fillStyle='rgba(255,255,255,0.75)';ctx.font='bold 16px "Courier New",monospace';
 ctx.fillText('N I N J A   D U E L   ·   13 忍者 · 6 地图 · 大战场',W/2,206);
 const optY=[276,340];
 const opts=[
  {key:'1',label:'双 人 对 战',sub:'1P 键盘左区  vs  2P 方向键 + 小键盘',col:'#ffd93b'},
  {key:'2',label:'人 机 对 战',sub:'1P 键盘左区  vs  电脑 AI',col:'#8fd3ff'}
 ];
 for(let i=0;i<opts.length;i++){
  const o=opts[i],y=optY[i];
  ctx.save();ctx.strokeStyle=o.col;ctx.lineWidth=2;ctx.globalAlpha=0.35+0.25*Math.sin(time*3+i);rrect(W/2-250,y-38,500,62,10);ctx.stroke();ctx.restore();
  ctx.font='bold 26px "Courier New",monospace';ctx.fillStyle=o.col;ctx.fillText(`[ ${o.key} ]   ${o.label}`,W/2,y-2);
  ctx.font='bold 12px "Courier New",monospace';ctx.fillStyle='rgba(255,255,255,0.45)';ctx.fillText(o.sub,W/2,y+18);
 }
 ctx.font='bold 12px "Courier New",monospace';ctx.fillStyle='rgba(255,255,255,0.30)';ctx.fillText('按 1 或 2 选择模式   ·   点击屏幕也可开始',W/2,442);
 ctx.font='bold 10px "Courier New",monospace';ctx.fillStyle='rgba(255,255,255,0.22)';
 ctx.fillText('1P: A D 移动  W 跳  S 防御  J 普攻  K/L/I 技能  U 奥义',W/2,482);
 ctx.fillText('2P: ← → 移动  ↑ 跳  ↓ 防御  小键盘 1/2/3/4 技能  0 奥义',W/2,502);
}
function drawOverlay(){
 if(gameState!=='over')return;
 ctx.fillStyle='rgba(3,6,14,0.74)';ctx.fillRect(0,0,W,H);
 ctx.textAlign='center';
 const col=winnerText.includes('1P')?'#5fb8ff':winnerText.includes('2P')?'#ff5a5a':'#e63946';
 ctx.save();ctx.shadowBlur=32;ctx.shadowColor=col;ctx.font='bold 76px "Courier New",monospace';ctx.fillStyle=col;ctx.fillText(winnerText,W/2,H/2-10);ctx.restore();
 if(stateTimer>1.0){ctx.globalAlpha=0.4+0.6*Math.abs(Math.sin(time*3));ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='bold 18px "Courier New",monospace';ctx.fillText('按 空格 键 再 战',W/2,H/2+66);ctx.globalAlpha=1;}
}

/* ═══ 流程 ═══ */
function startMode(m){
 resumeAudio();mode=m;gameState='select';stateTimer=0;
 sel.p1=0;sel.p2=1;sel.lock1=false;sel.lock2=false;sel.cpuTimer=0;sel.goTimer=0;ultFinish=null;
 selScrollX=0;
}
function startFight(){
 const c1=CHARACTERS[sel.p1],c2=CHARACTERS[sel.p2];
 p1=new Fighter({char:c1,isPlayer:true,pIndex:1,x:400,facing:1});
 p2=new Fighter({char:c2,isPlayer:mode==='pvp',pIndex:2,x:1200,facing:-1});
 p1.auraOn=true;p2.auraOn=true;
 currentMapIndex=sel.mapIndex;camX=0;
 particles=[];texts=[];clones=[];projectiles=[];hazards=[];decos=[];shocks=[];
 hitStop=0;shake=0;flashScreen=0;roundBanner=1.2;gameState='fight';stateTimer=0;ultFinish=null;
 for(let i=0;i<50;i++){
  particles.push({x:400+rand(-60,60),y:GROUND-rand(0,120),vx:rand(-130,130),vy:rand(-360,-80),life:rand(0.4,0.9),maxLife:0.9,size:rand(2,6),color:'#5fb8ff',grav:500});
  particles.push({x:1200+rand(-60,60),y:GROUND-rand(0,120),vx:rand(-130,130),vy:rand(-360,-80),life:rand(0.4,0.9),maxLife:0.9,size:rand(2,6),color:'#ff5a5a',grav:500});
 }
 SFX.ultBoom();
}
function updateSelect(dt){
 if(!sel.lock1){if(pressed[1].left)sel.p1=(sel.p1+CHARACTERS.length-1)%CHARACTERS.length;if(pressed[1].right)sel.p1=(sel.p1+1)%CHARACTERS.length;if(pressed[1].up)sel.p1=(sel.p1+CHARACTERS.length-4)%CHARACTERS.length;if(pressed[1].down)sel.p1=(sel.p1+4)%CHARACTERS.length;if(pressed[1].atk)sel.lock1=true;}
 else if(pressed[1].s1)sel.lock1=false;
 if(mode==='pvp'){if(!sel.lock2){if(pressed[2].left)sel.p2=(sel.p2+CHARACTERS.length-1)%CHARACTERS.length;if(pressed[2].right)sel.p2=(sel.p2+1)%CHARACTERS.length;if(pressed[2].up)sel.p2=(sel.p2+CHARACTERS.length-4)%CHARACTERS.length;if(pressed[2].down)sel.p2=(sel.p2+4)%CHARACTERS.length;if(pressed[2].atk)sel.lock2=true;}else if(pressed[2].s1)sel.lock2=false;}
 else{if(!sel.lock2){sel.cpuTimer+=dt;if(sel.cpuTimer>0.25){sel.cpuTimer=0;sel.p2=Math.floor(Math.random()*CHARACTERS.length);if(Math.random()<0.5)sel.lock2=true;}}}
 if(sel.lock1&&sel.lock2){sel.goTimer+=dt;if(sel.goTimer>0.9)startFight();}else sel.goTimer=0;
}
function updateFight(dt){
 if(hitStop>0){hitStop-=dt;updateParticles(dt*0.15);if(shake>0)shake=Math.max(0,shake-dt*60);if(flashScreen>0)flashScreen=Math.max(0,flashScreen-dt*4);return;}
 updateSfxCd(dt);
 handleInput(p1,input[1],buffer[1],dt);
 if(mode==='pvp')handleInput(p2,input[2],buffer[2],dt);else updateAI(p2,p1,dt);
 p1.update(dt,p2);p2.update(dt,p1);
 const dx=p2.x-p1.x;const minD=48;
 if(Math.abs(dx)<minD && p1.move===null && p2.move===null){const push=(minD-Math.abs(dx))/2*(Math.sign(dx)||1);p2.x+=push;p1.x-=push;p1.x=clamp(p1.x,62,WORLD_W-62);p2.x=clamp(p2.x,62,WORLD_W-62);}
 const targetCam=clamp((p1.x+p2.x)/2-W/2,0,WORLD_W-W);
 camX+=(targetCam-camX)*Math.min(1,dt*5);
 updateParticles(dt);resolveProjectiles();resolveClones();resolveHazards(dt);
 if(shake>0)shake=Math.max(0,shake-dt*60);
 if(flashScreen>0)flashScreen=Math.max(0,flashScreen-dt*4);
 if(roundBanner>0)roundBanner-=dt;
 if(gameState==='fight'){
  if(p2.hp<=0 && p1.hp<=0){winnerText='双 方 平 局';gameState='over';stateTimer=0;}
  else if(p2.hp<=0 && !ultFinish){winnerText=mode==='pve'?'你 赢 了':'1P  胜 利';gameState='over';stateTimer=0;}
  else if(p1.hp<=0 && !ultFinish){winnerText=mode==='pve'?'你 输 了':'2P  胜 利';gameState='over';stateTimer=0;}
 }
}
function update(dt){
 time+=dt;stateTimer+=dt;
 for(const pi of [1,2])for(const a of ACTIONS){if(buffer[pi][a]>0)buffer[pi][a]=Math.max(0,buffer[pi][a]-dt);}
 switch(gameState){
  case 'title':break;
  case 'select':updateSelect(dt);break;
  case 'fight':updateFight(dt);break;
  case 'ultFinish':updateUltFinish(dt);updateParticles(dt*0.3);break;
  case 'over':updateParticles(dt);if(p1)p1.update(dt,p2);if(p2)p2.update(dt,p1);if(shake>0)shake=Math.max(0,shake-dt*60);if(flashScreen>0)flashScreen=Math.max(0,flashScreen-dt*4);break;
 }
}
function render(){
 ctx.clearRect(0,0,W,H);
 if(gameState==='title'){drawWorld();drawTitle();return;}
 if(gameState==='select'){drawSelectScreen();return;}
 if(gameState==='ultFinish'){drawUltFinishPortrait();return;}
 ctx.save();
 if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));
 drawWorld();
 ctx.save();
 ctx.translate(-camX,0);
 drawShadows();drawClones();
 const list=[p1,p2].filter(Boolean).sort((a,b)=>a.y-b.y);
 for(const f of list)drawFighter(f);
 drawHazards();drawDecos();drawParticles();drawShocks();drawProjectiles();drawTexts();
 ctx.restore();
 ctx.restore();
 if(flashScreen>0){ctx.fillStyle=`rgba(255,180,60,${flashScreen*0.42})`;ctx.fillRect(0,0,W,H);}
 if(gameState==='fight'){
  drawHUD();
  if(roundBanner>0){const a=clamp(roundBanner/1.2,0,1);ctx.save();ctx.globalAlpha=Math.min(1,a*2.2);ctx.textAlign='center';ctx.font='bold 54px "Courier New",monospace';ctx.lineWidth=8;ctx.strokeStyle='rgba(0,0,0,0.8)';ctx.strokeText('战 斗 开 始',W/2,220);ctx.fillStyle='#ffd93b';ctx.fillText('战 斗 开 始',W/2,220);ctx.restore();}
 }
 drawOverlay();
}

/* ═══ 事件 ═══ */
function skipUltFinish(){
 if(!ultFinish)return;
 const atk=ultFinish.attacker;
 const p1Won=atk===p1;
 winnerText=mode==='pve'?(p1Won?'你 赢 了':'你 输 了'):(p1Won?'1P  胜 利':'2P  胜 利');
 gameState='over';stateTimer=1.1;ultFinish=null;
}
window.addEventListener('keydown',e=>{
 resumeAudio();
 const code=e.code;
 if(code.startsWith('Arrow')||code.startsWith('Numpad')||code==='Space'){e.preventDefault();}
 if(gameState==='title'){if(code==='Digit1'){startMode('pvp');return;}if(code==='Digit2'){startMode('pve');return;}return;}
 if(gameState==='select'){if(code==='KeyQ'){e.preventDefault();sel.mapIndex=(sel.mapIndex+MAPS.length-1)%MAPS.length;return;}if(code==='KeyE'){e.preventDefault();sel.mapIndex=(sel.mapIndex+1)%MAPS.length;return;}}
 if(gameState==='ultFinish'){if(code==='Space'||code==='Enter'||code==='Escape'){skipUltFinish();}return;}
 if(gameState==='over'){if(stateTimer>1.0&&(code==='Space'||code==='Enter'))startMode(mode);return;}
 const m=KEYMAP[code];if(!m)return;
 const [pi,act]=m;
 if(!input[pi][act]){pressed[pi][act]=true;buffer[pi][act]=BUFFER_TIME;}
 input[pi][act]=true;
});
window.addEventListener('keyup',e=>{const m=KEYMAP[e.code];if(!m)return;e.preventDefault();const [pi,act]=m;input[pi][act]=false;});
window.addEventListener('blur',()=>{for(const pi of [1,2])for(const a of ACTIONS){input[pi][a]=false;pressed[pi][a]=false;buffer[pi][a]=0;}});
cvs.addEventListener('pointerdown',e=>{
 e.preventDefault();resumeAudio();
 if(gameState==='title'){const r=cvs.getBoundingClientRect();const y=(e.clientY-r.top)/r.height*H;if(y>240&&y<322)startMode('pvp');else if(y>304&&y<386)startMode('pve');else startMode('pvp');}
 else if(gameState==='ultFinish'){skipUltFinish();}
 else if(gameState==='over' && stateTimer>1.0){startMode(mode);}
});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('click',resumeAudio);

/* ═══ 移动端虚拟按键绑定 ═══ */
(function bindTouchControls(){
  const isMobile = (window.matchMedia && (window.matchMedia('(pointer:coarse)').matches || window.matchMedia('(max-width:900px)').matches))
                || 'ontouchstart' in window || window.innerWidth < 900;
  if(!isMobile) return;
  const bindBtn = (id, pi, act)=>{
    const el = document.getElementById(id);
    if(!el) return;
    const on  = (e)=>{ e.preventDefault(); resumeAudio(); el.classList.add('active');
      if(!input[pi][act]){ pressed[pi][act]=true; buffer[pi][act]=BUFFER_TIME; }
      input[pi][act]=true; };
    const off = (e)=>{ e.preventDefault(); el.classList.remove('active'); input[pi][act]=false; };
    el.addEventListener('touchstart', on,  {passive:false});
    el.addEventListener('touchend',   off);
    el.addEventListener('touchcancel',off);
    el.addEventListener('mousedown',   on);
    el.addEventListener('mouseup',   off);
    el.addEventListener('mouseleave', off);
  };
  bindBtn('btn-left',  1,'left');
  bindBtn('btn-right', 1,'right');
  bindBtn('btn-up',    1,'up');
  bindBtn('btn-down',  1,'down');
  bindBtn('btn-atk',   1,'atk');
  bindBtn('btn-s1',    1,'s1');
  bindBtn('btn-s2',    1,'s2');
  bindBtn('btn-s3',    1,'s3');
  bindBtn('btn-ult',   1,'ult');

  const mapBar = document.getElementById('tc-map');
  const prevMap = document.getElementById('btn-map-prev');
  const nextMap = document.getElementById('btn-map-next');
  const fakeKey = (code, down)=>{
    const ev = new KeyboardEvent(down?'keydown':'keyup',{code,bubbles:true});
    window.dispatchEvent(ev);
  };
  prevMap.addEventListener('touchstart', e=>{ e.preventDefault(); resumeAudio(); fakeKey('KeyQ',true); fakeKey('KeyQ',false); });
  nextMap.addEventListener('touchstart', e=>{ e.preventDefault(); resumeAudio(); fakeKey('KeyE',true); fakeKey('KeyE',false); });

  // 选人界面显示切地图按钮，其他界面隐藏
  const _origRender = render;
  window.__syncTcMap = function(){
    if(!mapBar) return;
    if(typeof gameState!=='undefined' && gameState==='select') mapBar.classList.add('on');
    else mapBar.classList.remove('on');
  };
  const _tick = ()=>{ try{ window.__syncTcMap(); }catch(e){} requestAnimationFrame(_tick); };
  requestAnimationFrame(_tick);
})();

let lastT=performance.now();
function loop(now){
 let dt=(now-lastT)/1000;lastT=now;dt=Math.min(dt,0.045);
 update(dt);render();
 for(const pi of [1,2])for(const a of ACTIONS)pressed[pi][a]=false;
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
