function rrect(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function shade(hex,amt){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=clamp(Math.round(r*(1+amt)),0,255);
  g=clamp(Math.round(g*(1+amt)),0,255);
  b=clamp(Math.round(b*(1+amt)),0,255);
  return `rgb(${r},${g},${b})`;
}

/* ═══════════════════════════════════════════════════════
   ★★★ WebAudio 合成音效系统 ★★★
   ═══════════════════════════════════════════════════════ */
let audioCtx = null;
let masterGain = null;
let _noiseBuf = null;
let audioEnabled = false;

function initAudio(){
  if (audioCtx) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.32;
    masterGain.connect(audioCtx.destination);
    audioEnabled = true;
  } catch(e){ audioCtx = null; }
}
function resumeAudio(){
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended'){
    audioCtx.resume().catch(()=>{});
  }
}
function getNoise(dur){
  if (!audioCtx) return null;
  if (!_noiseBuf || _noiseBuf.duration < dur){
    const sr = audioCtx.sampleRate;
    const len = Math.max(Math.floor(sr * Math.max(dur,0.5)), sr);
    _noiseBuf = audioCtx.createBuffer(1, len, sr);
    const d = _noiseBuf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = Math.random()*2 - 1;
  }
  return _noiseBuf;
}
function playOsc(freq, dur, type, vol, slideTo, delay){
  if (!audioCtx || !audioEnabled) return;
  const t0 = audioCtx.currentTime + (delay||0);
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol||0.15, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(masterGain);
  osc.start(t0); osc.stop(t0 + dur + 0.03);
}
function playNoise(dur, vol, filterFreq, filterType, slideTo, delay){
  if (!audioCtx || !audioEnabled) return;
  const buf = getNoise(dur);
  if (!buf) return;
  const t0 = audioCtx.currentTime + (delay||0);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const filt = audioCtx.createBiquadFilter();
  filt.type = filterType || 'bandpass';
  filt.frequency.setValueAtTime(filterFreq||800, t0);
  if (slideTo) filt.frequency.exponentialRampToValueAtTime(Math.max(50, slideTo), t0+dur);
  filt.Q.value = 1.0;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol||0.15, t0 + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(filt); filt.connect(g); g.connect(masterGain);
  src.start(t0); src.stop(t0 + dur + 0.03);
}

class Fighter{
  constructor(cfg){
    this.char=cfg.char;
    this.isPlayer=!!cfg.isPlayer;
    this.pIndex=cfg.pIndex||0;
    this.x=cfg.x; this.y=GROUND;
    this.vx=0; this.vy=0;
    this.facing=cfg.facing||1;

    const st=this.char.stats;
    this.maxHp=st.hp; this.hp=this.maxHp; this.hpLag=1;
    this.maxChakra=100; this.chakra=0;
    this.speed=st.speed; this.jumpPower=st.jump;
    this.atkMul=st.atk; this.chakraMul=st.chakra;

    this.state='idle'; this.animTime=0;
    this.move=null; this.moveKey=null;
    this.moveTime=0; this.moveProgress=0;
    this.hitDone=false;
    this.ultStage=0;
    this.multiTimer=0;

    this.onGround=true;
    this.hurtTime=0; this.invuln=0; this.flash=0;
    this.deadTime=0; this.guarding=false;
    this.aiTimer=0.8; this.foe=null;

    this.combo=0; this.comboTimer=0;
    this.guardBreak=0;
    this.wantsUkemi=false;
    this.superArmor=0;
    this.sealTime=0;
    this.rageBuff=0;

    this.auraOn = false;
    this.wasOnGround = true;  /* 用于落地音效 */
    this.stepCd = 0;
  }

  getHurtbox(){
    const h=this.guarding?96:108;
    return {x:this.x-22, y:this.y-h, w:44, h};
  }
  getHitbox(m){
    if (m.fx==='totsuka'){
      const cx=this.x + this.facing * (m.range/2 + 20);
      return {x:cx - m.range/2, y:this.y-124, w:m.range, h:56};
    }
    if (m.ult) return {x:this.x - m.range/2, y:this.y-150, w:m.range, h:150};
    const cx=this.x + this.facing*(m.range/2+8);
    return {x:cx - m.range/2, y:this.y-108, w:m.range, h:108};
  }
  canAct(){ return this.state!=='dead' && this.hurtTime<=0 && this.move===null && this.sealTime<=0; }

  skillColor(key){
    if (key==='atk1'||key==='atk2'||key==='atk3') return '#ffe066';
    const sk=this.char.skills.find(s=>s.key===key);
    return sk ? sk.color : '#ffe066';
  }
  skillByKey(key){
    return this.char.skills.find(s=>s.key===key) || COMBO[key] || null;
  }

  startMove(key){
    const m=this.skillByKey(key);
    if (!m) return false;
    if (m.cost && this.chakra < m.cost) return false;
    if (m.cost) this.chakra -= m.cost;

    this.state=key; this.move=m; this.moveKey=key;
    this.moveTime=0; this.moveProgress=0;
    this.hitDone=false;
    this.ultStage=0;
    this.multiTimer=0;
    this.guarding=false;
    if (m.moveX) this.vx = this.facing * m.moveX;

    const col = m.color || '#ffe066';

    /* ── 起手音效 ── */
    if (key==='atk1'||key==='atk2'||key==='atk3'){ SFX.punch(); }
    else if (m.ult){
      SFX.ultCharge();
    } else {
      const fx = m.fx;
      if (fx==='rasengan')      SFX.rasengan();
      else if (fx==='kageBunshin') SFX.shadowClone();
      else if (fx==='odama')    SFX.odama();
      else if (fx==='chidori')  SFX.lightning();
      else if (fx==='gouryuuka')SFX.fire();
      else if (fx==='amaterasu')SFX.amaterasu();
      else if (fx==='raikiri')  SFX.lightning();
      else if (fx==='waterFall')SFX.water();
      else if (fx==='kamui')    SFX.kamui();
      else if (fx==='greatFireball') SFX.fireBig();
      else if (fx==='crowClone')SFX.shadowClone();
      else if (fx==='tsukuyomi')SFX.tsukuyomi();
      else if (fx==='gentleFist')SFX.gentleFist();
      else if (fx==='rotation') SFX.spin();
      else if (fx==='sixtyFour')SFX.gentleFist();
      else if (fx==='cherryImpact') SFX.hitBig();
      else if (fx==='healingPalm') SFX.heal();
      else if (fx==='cherryBloom') SFX.hitBig();
      else if (fx==='sandCoffin' || fx==='sandBurial' || fx==='sandShield') SFX.sand();
      else if (fx==='leafHurricane' || fx==='morningPeacock') SFX.kick();
      else if (fx==='daytimeTiger') SFX.tiger();
      else SFX.whoosh();
    }

    if (m.ult){
      this.invuln = 0.30;
      this.superArmor = m.dur;
      flashScreen = 0.9;
      shake = 22;
    }
    if (m.fx==='hakkeBarrage'){
      this.invuln = Math.max(this.invuln, m.dur*0.85);
    }
    this.spawnSkillFX(key, m, col, 0);
    return true;
  }

  spawnSkillFX(key, m, col, stage){
    const fx=m.fx, F=this.facing, P=particles, PR=projectiles, H=hazards, D=decos;
    switch(fx){

      /* ═══════ 漩涡鸣人 ═══════ */
      case 'rasengan': {
        for (let i=0;i<26;i++){
          const a=rand(0,Math.PI*2), r=rand(6,36);
          P.push({x:this.x+F*40+Math.cos(a)*r, y:this.y-62+Math.sin(a)*r,
                  vx:Math.cos(a+1.4)*200, vy:Math.sin(a+1.4)*200,
                  life:0.42, maxLife:0.42, size:rand(2,5), color:col, grav:0});
        }
        H.push({type:'orb', x:this.x+F*50, y:this.y-62, r:26,
                life:m.dur, maxLife:m.dur, color:col, owner:this, follow:true});
        break;
      }
      case 'kageBunshin': {
        /* 影分身术：3 个分身向前冲 */
        for (let i=0;i<3;i++){
          clones.push({x:this.x-F*i*30, y:this.y, facing:F,
            speed:rand(560,760), life:0.66, maxLife:0.66,
            color:this.char.skin.jacket, skin:this.char.skin,
            owner:this, dmg:140, kb:260, hit:false,
            effect:'clone'});
        }
        for (let i=0;i<24;i++){
          P.push({x:this.x+rand(-30,30), y:this.y-rand(20,90),
                  vx:rand(-80,80), vy:rand(-140,-30),
                  life:rand(0.3,0.7), maxLife:0.7, size:rand(4,10),
                  color:'#f0f0f0', grav:-30});
        }
        break;
      }
      case 'odama': {
        /* 大玉螺旋丸：向前推进的大球，多段判定 */
        for (let i=0;i<50;i++){
          const a=rand(0,Math.PI*2), r=rand(10,60);
          P.push({x:this.x+F*60+Math.cos(a)*r, y:this.y-62+Math.sin(a)*r,
                  vx:Math.cos(a+1.6)*240 + F*160, vy:Math.sin(a+1.6)*240,
                  life:rand(0.4,0.7), maxLife:0.7, size:rand(3,9),
                  color:col, grav:0});
        }
        H.push({type:'odama', x:this.x+F*60, y:this.y-62, r:44,
                life:0.75, maxLife:0.75, color:col, owner:this,
                follow:true, advance:F*520, dmg:380, hitCount:0});
        break;
      }
      case 'bijudama': {
        if (stage===1){
          for (let i=0;i<70;i++){
            const a=rand(0,Math.PI*2), r=rand(90,200);
            const px=this.x+F*50+Math.cos(a)*r;
            const py=this.y-70+Math.sin(a)*r;
            P.push({x:px, y:py,
              vx:(this.x+F*50-px)*2.8, vy:(this.y-70-py)*2.8,
              life:0.55, maxLife:0.55, size:rand(3,8),
              color: Math.random()<0.55?'#ff6b35':'#2a0a3a', grav:0});
          }
          shake = 14;
          SFX.ultBoom();
          D.push({type:'charge', x:this.x+F*50, y:this.y-70,
                  r:0, maxR:52, life:0.55, maxLife:0.55,
                  color:'#ff6b35', owner:this});
        }
        if (stage===2){
          PR.push({x:this.x+F*70, y:this.y-70,
            vx:F*520, vy:0, life:1.6, maxLife:1.6,
            color:'#ff6b35', size:56, kind:'bijudama',
            owner:this, dmg:960, kb:760, spin:0, big:true});
          flashScreen = Math.max(flashScreen, 0.85);
          shake = 32;
          SFX.ultBoom();
        }
        break;
      }

      /* ═══════ 宇智波佐助 ═══════ */
      case 'chidori': {
        /* 千鸟：手臂覆盖雷电 + 突进 */
        for (let i=0;i<40;i++){
          P.push({x:this.x+F*rand(0,60), y:this.y-62+rand(-30,30),

                  life:rand(0.16,0.34), maxLife:0.34,
                  size:rand(2,5), color:col, grav:0});
        }
        H.push({type:'chidoriArm', x:this.x+F*30, y:this.y-62, r:24,
                life:m.dur*0.7, maxLife:m.dur*0.7, color:col, owner:this,
                follow:true});
        break;
      }
      case 'gouryuuka': {
        /* 豪龙火：3 条龙形火焰呈扇形扩散 */
        for (let i=0;i<3;i++){
          const ang = (i-1) * 0.32;
          const vy = Math.sin(ang) * 300;
          PR.push({x:this.x+F*30, y:this.y-70,
            vx:F*620, vy:vy, life:1.0, maxLife:1.0,
            color:'#ff6b35', size:14, kind:'dragonFire',

        }
        for (let i=0;i<30;i++){
          P.push({x:this.x+F*rand(0,30), y:this.y-70+rand(-15,15),

                  life:0.5, maxLife:0.5, size:rand(3,8),

        }
        break;
      }
      case 'amaterasu': {
        /* 天照：贴地黑炎跟随对手位置 */
        const fx2 = this.foe ? this.foe.x : this.x + F*180;
        H.push({type:'amaterasu', x:fx2, y:GROUND-30, r:90,
                life:2.0, maxLife:2.0, color:'#0d0d1a',

  tryHit(target, m){
    if (!target || target.state==='dead') return;
    if (target.invuln > 0) return;
    if (!m.multi && this.hitDone) return;
    if (!aabb(this.getHitbox(m), target.getHurtbox())) return;

    if (!m.multi) this.hitDone = true;

    const dir=this.facing;
    let rawDmg = Math.round((m.dmg||0)*this.atkMul*rand(0.93,1.07));
    if (this.rageBuff > 0) rawDmg = Math.round(rawDmg * 1.25);
    if (rawDmg <= 0) return;
    const col = m.color || '#ffe066';

    /* ── 防御 ── */
    if (target.guarding && !m.ult){
      const reduced = Math.max(1, Math.round(rawDmg * 0.22));
      target.hp = Math.max(0, target.hp - reduced);
      target.vx  = dir * (m.kb||0) * 0.35;
      target.flash = 0.08;
      /* ★ 破防系数（原 ×4.5 → 现 ×0.5，因为 rawDmg 扩大 10 倍） */
      target.guardBreak = Math.min(100, target.guardBreak + rawDmg * 0.5);
      if (target.guardBreak >= 100){
        target.guardBreak = 0;
        target.guarding = false;
        target.state='hurt'; target.hurtTime=0.70;
        target.vx = dir * 280; target.flash = 0.16;
        hitStop = 0.14; shake = 22;
        flashScreen = Math.max(flashScreen, 0.35);
        spawnHitEffect(target.x, target.y-64, dir, true, '#ff5c6c', 40);
        spawnDamageText(target.x, target.y-150, '破 防', '#ff5c6c', 30);
        SFX.guardBreak();
      } else {
        hitStop = 0.045; shake = 7;
        spawnHitEffect(target.x, target.y-62, dir, false, '#9ecbff', 12);
        spawnDamageText(target.x, target.y-124, reduced, '#9ecbff', 22);
        if (hitSfxCd <= 0){ SFX.block(); hitSfxCd = 0.05; }
      }
      this.chakra = Math.min(this.maxChakra, this.chakra + (m.chakra||0)*0.4);
      target.chakra = Math.min(target.maxChakra, target.chakra + 3);
      return;
    }

    /* ── 霸体 ── */
    if (target.superArmor > 0 && !m.ult){
      const reduced = Math.max(1, Math.round(rawDmg * 0.7));
      target.hp = Math.max(0, target.hp - reduced);
      target.flash = 0.10;
      target.chakra = Math.min(target.maxChakra, target.chakra + 3);
      this.chakra = Math.min(this.maxChakra, this.chakra + (m.chakra||0)*this.chakraMul);
      hitStop = 0.05; shake = 9;
      spawnHitEffect(target.x, target.y-58, dir, false, col, 14);
      spawnDamageText(target.x, target.y-124, reduced, '#ffd93b', 22);
      if (hitSfxCd <= 0){ SFX.hit(); hitSfxCd = 0.05; }
      if (target.hp <= 0){
        target.state='dead'; target.vy=-450; target.vx=dir*340; target.move=null;
      }
      return;
    }

    /* ── 十拳剑封印 ── */
    const isSeal = (m.fx === 'totsuka');
    if (isSeal){
      target.hp = Math.max(0, target.hp - rawDmg);
      target.sealTime = 1.30;
      target.hurtTime = Math.max(target.hurtTime, 0.30);
      target.state='hurt';
      target.vx = 0; target.vy = 0;
      target.flash = 0.16;
      target.move = null;
      target.chakra = 0;
      this.chakra = Math.min(this.maxChakra, this.chakra + (m.chakra||0)*this.chakraMul);
      hitStop = 0.20; shake = 20;
      spawnHitEffect(target.x, target.y-64, dir, true, '#c0392b', 48);
      spawnDamageText(target.x, target.y-150, '封 印', '#c0392b', 32);
      spawnDamageText(target.x, target.y-186, rawDmg, '#ffffff', 26);
      SFX.hitBig();
      if (target.hp <= 0){
        target.state='dead'; target.vy=-400; target.vx=dir*260;
      }
      return;
    }

    /* ── 正常命中 ── */
    target.hp = Math.max(0, target.hp - rawDmg);
    target.state='hurt';
    target.guarding = false;
    target.guardBreak = 0;
    target.hurtTime = m.launch ? 0.55 : 0.28;
    target.vx = dir * (m.kb||0);
    target.flash = 0.12;
    target.move = null;
    target.superArmor = 0;
    if (m.launch) target.vy = -440;

    this.chakra = Math.min(this.maxChakra, this.chakra + (m.chakra||0)*this.chakraMul);
    target.chakra = Math.min(target.maxChakra, target.chakra + 4);

    if (m.multi){
      hitStop = 0.03; shake = 5;
      spawnHitEffect(target.x, target.y - 58, dir, false, col, 12);
      spawnDamageText(target.x, target.y - 122, rawDmg, '#ffffff', 18);
      if (target.onGround === false) target.vy = Math.min(target.vy, -40);
      if (hitSfxCd <= 0){ SFX.hit(); hitSfxCd = 0.04; }
    } else {
      hitStop = m.ult ? 0.26 : 0.075;
      shake = m.ult ? 32 : 11;
      spawnHitEffect(target.x, target.y - 58, dir, !!m.ult, col, m.ult?52:22);
      spawnDamageText(target.x, target.y - 122, rawDmg, m.ult ? '#ff5c6c' : '#ffffff', m.ult?36:26);
      if (m.ult) SFX.hitBig();
      else if (hitSfxCd <= 0){ SFX.hit(); hitSfxCd = 0.05; }
    }

    this.combo++; this.comboTimer = 1.7;

    if (target.hp <= 0){
      target.state='dead';
      target.vy=-450; target.vx=dir*340; target.move=null;
      shake = 36; flashScreen = 0.7;
    }
  }

  update(dt, foe){
    this.foe = foe;
    this.animTime += dt;
    if (this.invuln > 0) this.invuln -= dt;
    if (this.flash > 0)  this.flash  -= dt;
    if (this.superArmor > 0) this.superArmor -= dt;
    if (this.sealTime > 0)   this.sealTime   -= dt;
    if (this.rageBuff > 0)   this.rageBuff   -= dt;
    if (this.comboTimer > 0){
      this.comboTimer -= dt;
      if (this.comboTimer <= 0) this.combo = 0;
    }
    if (this.stepCd > 0) this.stepCd -= dt;
    if (!this.guarding && this.hurtTime <= 0){
      this.guardBreak = Math.max(0, this.guardBreak - dt*28);
    }

    const hpRatio = this.hp / this.maxHp;
    this.hpLag += (hpRatio - this.hpLag) * Math.min(1, dt*4.5);

    if (this.hp <= 0 && this.state !== 'dead'){
      this.state='dead'; this.move=null;
      this.vx = 0; this.vy = -420;
    }
    if (this.state === 'dead') this.deadTime += dt;

    /* 重力 + 落地音效 */
    this.wasOnGround = this.onGround;
    this.vy += GRAVITY * dt;
    this.y  += this.vy * dt;
    if (this.y >= GROUND){
      const wasAir = !this.wasOnGround;
      this.y = GROUND; this.vy = 0; this.onGround = true;
      if (this.state === 'jump') this.state = 'idle';
      if (wasAir){
        SFX.land();
        spawnHitEffect(this.x, GROUND, 0, false, 'rgba(255,220,150,0.7)', 8);
      }
      if (this.state === 'hurt' && this.wantsUkemi){
        this.wantsUkemi = false;
        this.hurtTime = Math.min(this.hurtTime, 0.08);
        this.invuln   = Math.max(this.invuln, 0.35);
        this.vx *= 0.5;
        spawnHitEffect(this.x, this.y-36, 0, false, '#9ecbff', 16);
        spawnDamageText(this.x, this.y-140, '受身', '#9ecbff', 22);
        SFX.whoosh();
      }
    } else {
      this.onGround = false;
    }

    let fr;
    if (this.move) fr = 0.03;
    else if (this.guarding) fr = 0.0001;
    else if (this.onGround) fr = 0.0005;
    else fr = 0.30;
    this.vx *= Math.pow(fr, dt);
    if (Math.abs(this.vx) < 4) this.vx = 0;
    this.x += this.vx * dt;
    this.x = clamp(this.x, 62, W-62);

    /* 跑动脚步声 */
    if (this.state === 'run' && this.onGround && this.stepCd <= 0){
      this.stepCd = 0.22;
      SFX.step();
    }

    if (this.hurtTime > 0){
      this.hurtTime -= dt;
      if (this.hurtTime <= 0 && this.state === 'hurt') this.state = 'idle';
    }

    if (this.move){
      this.moveTime += dt;
      this.moveProgress = this.moveTime / this.move.dur;
      const m = this.move;

      if (m.ult){
        const stgs = ULT_STAGES[this.char.id];
        if (stgs && this.ultStage < stgs.length){
          if (this.moveTime >= stgs[this.ultStage].t){
            const stg = stgs[this.ultStage].s;
            this.ultStage++;
            this.spawnSkillFX(m.key, m, m.color, stg);
          }
        }
      }

      if (this.moveTime >= m.hitStart && this.moveTime <= m.hitEnd && m.hitEnd > 0){
        if (m.multi){
          this.multiTimer -= dt;
          if (this.multiTimer <= 0){
            this.multiTimer = m.multiInterval || 0.10;
            this.tryHit(foe, m);
          }
        } else if (!this.hitDone){
          this.tryHit(foe, m);
        }
      }

      if (this.moveProgress >= 1){
        this.move = null; this.moveProgress = 0;
        this.ultStage = 0;
        if (this.state !== 'dead' && this.state !== 'hurt'){
          this.state = this.onGround ? 'idle' : 'jump';
        }
      }
    }

    if (this.canAct() && this.onGround && Math.abs(this.vx) < 30){
      if (foe && foe.state !== 'dead') this.facing = foe.x > this.x ? 1 : -1;
    }
  }
}

/* ═══════════════════════════════════════════════════════
   输入 / AI / 粒子 / 判定（结构与逻辑保持一致）
   ═══════════════════════════════════════════════════════ */
function handleInput(f, inp, buf, dt){
  if (!f || f.state === 'dead') return;
  if (f.sealTime > 0){ f.guarding = false; return; }

  if (f.hurtTime > 0){
    if (!f.onGround && (inp.down || buf.up > 0)){
      f.wantsUkemi = true;
      if (buf.up > 0) buf.up = 0;
    }
    f.guarding = false;
    return;
  }

  const busy = f.move !== null;

  if (!busy && f.onGround && inp.down){
    f.guarding = true; f.state = 'guard';
    f.vx *= Math.pow(0.008, dt);
    return;
  }
  if (f.guarding){
    f.guarding = false;
    if (f.state === 'guard') f.state = 'idle';
  }

  let dir = 0;
  if (inp.left)  dir--;
  if (inp.right) dir++;
  const spd = f.speed * (f.rageBuff>0 ? 1.25 : 1);
  if (!busy && f.onGround){
    if (dir !== 0){ f.vx = dir*spd; f.state='run'; f.facing=dir; }
    else if (f.state === 'run'){ f.state = 'idle'; }
  } else if (!busy && !f.onGround && dir !== 0){
    f.vx += dir * 1250 * dt;
  }

  if (buf.up > 0 && f.onGround && !busy){
    buf.up = 0;
    f.vy = -f.jumpPower; f.onGround = false; f.state = 'jump';
    SFX.jump();
  }

  if (buf.atk > 0){
    if (!busy){ buf.atk = 0; f.startMove('atk1'); }
    else if (f.moveKey === 'atk1' && f.moveProgress > 0.32){ buf.atk = 0; f.startMove('atk2'); }
    else if (f.moveKey === 'atk2' && f.moveProgress > 0.32){ buf.atk = 0; f.startMove('atk3'); }
  }

  if (buf.s1  > 0 && !busy && f.onGround && f.startMove('s1'))  buf.s1  = 0;
  if (buf.s2  > 0 && !busy && f.onGround && f.startMove('s2'))  buf.s2  = 0;
  if (buf.s3  > 0 && !busy && f.onGround && f.startMove('s3'))  buf.s3  = 0;
  if (buf.ult > 0 && !busy && f.onGround && f.startMove('ult')) buf.ult = 0;
}

function updateAI(f, foe, dt){
  if (!f || f.state === 'dead' || f.hurtTime > 0) return;
  if (f.sealTime > 0) return;
  if (f.move) return;

  const dx = foe.x - f.x;
  const adx = Math.abs(dx);
  f.facing = dx > 0 ? 1 : -1;
  f.aiTimer -= dt;

  const guardP = 1 - Math.pow(1 - 0.55, dt);
  if (foe.move && adx < 135 && Math.random() < guardP){
    f.guarding = true; f.state='guard';
    f.vx *= 0.7; return;
  }
  f.guarding = false;

  if (adx > 122){
    f.vx = Math.sign(dx)*f.speed*0.93;
    if (f.onGround) f.state = 'run';
  } else if (adx < 54){
    f.vx = -Math.sign(dx)*f.speed*0.62;
    if (f.onGround) f.state = 'run';
  } else {
    f.vx *= 0.72;
    if (f.onGround) f.state = 'idle';
    if (f.aiTimer <= 0){
      f.aiTimer = rand(0.34, 0.95);
      const r = Math.random();
      if (f.chakra >= 100 && r < 0.38)      f.startMove('ult');
      else if (f.chakra >= 44 && r < 0.55)  f.startMove('s3');
      else if (f.chakra >= 30 && r < 0.72)  f.startMove('s2');
      else if (f.chakra >= 22 && r < 0.88)  f.startMove('s1');
      else                                   f.startMove('atk1');
    }
  }
}

function spawnHitEffect(x, y, dir, big, color, n){
  n = n || (big?50:18);
  for (let i=0;i<n;i++){
    const a=rand(0,Math.PI*2);
    const sp=rand(90, big?600:340);
    particles.push({
      x, y,
      vx: Math.cos(a)*sp + dir*130,
      vy: Math.sin(a)*sp,
      life: rand(0.22,0.66), maxLife:0.66,
      size: rand(2, big?9:5),
      color: Math.random()<0.42?'#ffffff':color,
      grav: big?470:900
    });
  }
  particles.push({x,y,vx:0,vy:0,life:0.3,maxLife:0.3,
    size:big?60:30,color:big?'#fff':'#ff0',ring:true,grav:0});
}
function spawnDamageText(x,y,val,color,size){
  if (typeof val==='number' && val<=0) return;
  texts.push({x,y,vy:-100,life:1.0,text:val,color,size:size||26});
}

function updateParticles(dt){
  for (let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.vy += p.grav*dt;
    p.x  += p.vx*dt;
    p.y  += p.vy*dt;
    p.vx *= Math.pow(0.12, dt);
    p.life -= dt;
    if (p.life <= 0) particles.splice(i,1);
  }
  for (let i=texts.length-1;i>=0;i--){
    const t=texts[i];
    t.y  += t.vy*dt;
    t.vy *= Math.pow(0.05, dt);
    t.life -= dt;
    if (t.life <= 0) texts.splice(i,1);
  }
  for (let i=clones.length-1;i>=0;i--){
    const c=clones[i];
    c.x += c.facing*c.speed*dt;
    c.life -= dt;
    if (c.life <= 0) clones.splice(i,1);
  }
  for (let i=projectiles.length-1;i>=0;i--){
    const pr=projectiles[i];
    pr.x += pr.vx*dt;
    pr.y += pr.vy*dt;
    if (pr.waveAmp){
      pr.wavePhase = (pr.wavePhase||0) + dt*14;
      pr.y += Math.sin(pr.wavePhase) * pr.waveAmp * dt * 4;
    }
    pr.spin = (pr.spin||0) + dt*22;
    pr.life -= dt;
    if (pr.life <= 0 || pr.x < -140 || pr.x > W+140) projectiles.splice(i,1);
  }
  for (let i=hazards.length-1;i>=0;i--){
    const h=hazards[i];
    h.life -= dt;
    h.tick = (h.tick||0) + dt;
    if (h.follow && h.owner){
      if (h.advance){
        h.x += h.advance * dt;
        /* 大玉螺旋丸多段判定 */
        if (h.type === 'odama' && h.owner.foe){
          const foe = h.owner.foe;
          if (foe.state !== 'dead' && foe.invuln <= 0){
            if (Math.abs(foe.x - h.x) < h.r + 22 && Math.abs((foe.y-54) - h.y) < 80){
              h.tick2 = (h.tick2||0) + dt;
              if (h.tick2 > 0.16){
                h.tick2 = 0;
                h.hitCount = (h.hitCount||0) + 1;
                if (h.hitCount <= 3){
                  const dmg = Math.round(h.dmg * 0.36 * h.owner.atkMul * rand(0.93,1.07));
                  foe.hp = Math.max(0, foe.hp - dmg);
                  foe.state='hurt'; foe.hurtTime=0.20; foe.flash=0.10; foe.move=null;
                  foe.vx = h.owner.facing * 220;
                  spawnDamageText(foe.x, foe.y-122, dmg, '#6fe8ff', 22);
                  spawnHitEffect(h.x, h.y, h.owner.facing, false, h.color, 16);
                  hitStop = 0.05; shake = 10;
                  SFX.hit();
                  if (foe.hp <= 0){ foe.state='dead'; foe.vy=-440; foe.vx=h.owner.facing*320; }
                }
              }
            }
          }
        }
      } else {
        h.x = h.owner.x + h.owner.facing * 50;
        h.y = h.owner.y - 62;
      }
    }
    if (h.life <= 0) hazards.splice(i,1);
  }
  for (let i=decos.length-1;i>=0;i--){
    const d=decos[i];
    d.life -= dt;
    if (d.life <= 0) decos.splice(i,1);
  }
}

function resolveProjectiles(){
  for (let i=projectiles.length-1;i>=0;i--){
    const pr=projectiles[i];
    if (!pr.owner || pr.owner.state === 'dead') continue;
    const foe = pr.owner === p1 ? p2 : p1;
    if (!foe || foe.state === 'dead' || foe.invuln > 0) continue;

    const hb = foe.getHurtbox();
    const r = pr.size;
    if (pr.x+r > hb.x && pr.x-r < hb.x+hb.w &&
        pr.y+r > hb.y && pr.y-r < hb.y+hb.h){
      const rawDmg = Math.round(pr.dmg * pr.owner.atkMul * rand(0.93,1.07));
      const dir = Math.sign(pr.vx || 1);
      if (rawDmg <= 0 && pr.kind !== 'bijudama' && pr.kind !== 'sandTsunami' && pr.kind !== 'indraArrow') continue;

      if (foe.guarding && pr.kind !== 'bijudama' && pr.kind !== 'sandTsunami' && pr.kind !== 'indraArrow'){
        const reduced = Math.max(1, Math.round(rawDmg*0.22));
        foe.hp = Math.max(0, foe.hp - reduced);
        foe.guardBreak = Math.min(100, foe.guardBreak + rawDmg*0.5);
        foe.vx = dir * pr.kb * 0.35;
        foe.flash = 0.08;
        if (foe.guardBreak >= 100){
          foe.guardBreak = 0; foe.guarding = false;
          foe.state='hurt'; foe.hurtTime=0.70;
          foe.vx = dir*280;
          hitStop=0.14; shake=22;
          spawnHitEffect(foe.x, foe.y-64, dir, true, '#ff5c6c', 40);
          spawnDamageText(foe.x, foe.y-150, '破 防', '#ff5c6c', 30);
          SFX.guardBreak();
        } else {
          hitStop=0.04; shake=6;
          spawnDamageText(foe.x, foe.y-124, reduced, '#9ecbff', 20);
          if (hitSfxCd <= 0){ SFX.block(); hitSfxCd = 0.05; }
        }
        projectiles.splice(i,1);
        continue;
      }

      if (foe.superArmor > 0 && pr.kind !== 'bijudama' && pr.kind !== 'sandTsunami' && pr.kind !== 'indraArrow'){
        const reduced = Math.max(1, Math.round(rawDmg*0.7));
        foe.hp = Math.max(0, foe.hp - reduced);
        foe.flash = 0.10;
        spawnDamageText(foe.x, foe.y-124, reduced, '#ffd93b', 22);
        if (hitSfxCd <= 0){ SFX.hit(); hitSfxCd = 0.05; }
        if (foe.hp <= 0){ foe.state='dead'; foe.vy=-450; foe.vx=dir*340; }
        projectiles.splice(i,1);
        continue;
      }

      foe.hp = Math.max(0, foe.hp - rawDmg);
      foe.state='hurt'; foe.hurtTime=0.28; foe.flash=0.12;
      foe.move=null; foe.guarding=false; foe.guardBreak=0;
      foe.vx = dir * pr.kb;
      pr.owner.chakra = Math.min(pr.owner.maxChakra, pr.owner.chakra + 4);
      foe.chakra = Math.min(foe.maxChakra, foe.chakra + 3);
      spawnHitEffect(pr.x, pr.y, dir, !!pr.big, pr.color, pr.big?44:16);
      spawnDamageText(foe.x, foe.y-122, rawDmg, pr.big?'#ff5c6c':'#ffffff', pr.big?36:24);
      hitStop = pr.big?0.22:0.05;
      shake = pr.big?28:8;
      if (pr.big) SFX.hitBig();
      else if (hitSfxCd <= 0){ SFX.hit(); hitSfxCd = 0.05; }
      if (foe.hp <= 0){ foe.state='dead'; foe.vy=-450; foe.vx=dir*340; }
      projectiles.splice(i,1);
    }
  }
}

function resolveClones(){
  for (const c of clones){
    if (c.hit || !c.owner) continue;
    const foe = c.owner === p1 ? p2 : p1;
    if (!foe || foe.state === 'dead' || foe.invuln > 0) continue;
    const box = {x:c.x-18, y:c.y-92, w:36, h:92};
    if (aabb(box, foe.getHurtbox())){
      c.hit = true;
      const rawDmg = Math.round(c.dmg * c.owner.atkMul * rand(0.93,1.07));
      if (foe.guarding){
        const reduced = Math.max(1, Math.round(rawDmg*0.22));
        foe.hp = Math.max(0, foe.hp - reduced);
        foe.guardBreak = Math.min(100, foe.guardBreak + rawDmg*0.5);
        spawnDamageText(foe.x, foe.y-124, reduced, '#9ecbff', 20);
        if (hitSfxCd <= 0){ SFX.block(); hitSfxCd = 0.05; }
      } else if (foe.superArmor > 0){
        const reduced = Math.max(1, Math.round(rawDmg*0.7));
        foe.hp = Math.max(0, foe.hp - reduced);
        spawnDamageText(foe.x, foe.y-124, reduced, '#ffd93b', 20);
        if (hitSfxCd <= 0){ SFX.hit(); hitSfxCd = 0.05; }
      } else {
        foe.hp = Math.max(0, foe.hp - rawDmg);
        foe.state='hurt'; foe.hurtTime=0.24; foe.flash=0.10; foe.move=null;
        foe.vx = c.facing * c.kb;
        spawnDamageText(foe.x, foe.y-122, rawDmg, '#ffffff', 22);
        if (hitSfxCd <= 0){ SFX.hit(); hitSfxCd = 0.05; }
      }
      spawnHitEffect(c.x, c.y-60, c.facing, false, c.skin.jacket, 14);
      hitStop = 0.04; shake = 6;
      if (foe.hp <= 0){ foe.state='dead'; foe.vy=-420; foe.vx=c.facing*320; }
    }
  }
}

function resolveHazards(dt){
  for (const h of hazards){
    if (!h.owner) continue;
    const foe = h.owner === p1 ? p2 : p1;
    if (!foe || foe.state === 'dead') continue;

    if (h.pull){
      const dx = h.x - foe.x, dy = h.y - (foe.y-54);
      const d  = Math.hypot(dx,dy);
      if (d < 220 && d > 0.001){
        const power = h.pullPower || 900;
        foe.vx += (dx/d) * power * dt;
        foe.vy += (dy/d) * power * 0.45 * dt;
      }
    }
    if (h.type === 'amaterasu'){
      if (foe.invuln <= 0 && Math.abs(foe.x - h.x) < h.r && foe.onGround){
        h.dmgTick = (h.dmgTick||0) + dt;
        if (h.dmgTick > 0.20){
          h.dmgTick = 0;
          const dmg = Math.max(1, Math.round(44 * h.owner.atkMul));
          foe.hp = Math.max(0, foe.hp - dmg);
          foe.flash = 0.08;
          spawnDamageText(foe.x, foe.y-140, dmg, '#a06bff', 20);
          if (foe.hp <= 0){ foe.state='dead'; foe.vy=-420; }
        }
      }
    }
  }
}

/* ═══════════════════════════════════════════════════════
   绘制（保留原有）
   ═══════════════════════════════════════════════════════ */
const BODY = {
  hipY: -46, chestY: -76, neckY: -86, headY: -98, headR: 12,
  legUp: 22, legLow: 21, armUp: 16, armLow: 15,
  legW: 8, armW: 7
};

function limbLine(x1,y1,x2,y2,w,color){
  ctx.strokeStyle=color; ctx.lineWidth=w; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
}
function drawLimbChain(x, y, shoulderAng, elbowAng, l1, l2, w, col1, col2){
  const jx = x + Math.sin(shoulderAng) * l1;
  const jy = y + Math.cos(shoulderAng) * l1;
  const ex = jx + Math.sin(shoulderAng + elbowAng) * l2;
  const ey = jy + Math.cos(shoulderAng + elbowAng) * l2;
  limbLine(x, y, jx, jy, w, col1);
  limbLine(jx, jy, ex, ey, w*0.92, col2 || col1);
  return {jx, jy, ex, ey};
}
function drawEye(cx, cy, type, eyeColor){
  ctx.fillStyle = '#f6f6fa';
  ctx.beginPath(); ctx.ellipse(cx, cy, 3.1, 3.6, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.ellipse(cx, cy-1.8, 3.1, 1.4, 0, 0, Math.PI); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.lineWidth = 0.7;
  ctx.beginPath();
  ctx.moveTo(cx - 3, cy - 2.2);
  ctx.quadraticCurveTo(cx, cy - 3.8, cx + 3, cy - 2.2);
  ctx.stroke();
  if (type === 'byakugan'){
    ctx.fillStyle = 'rgba(180,150,210,0.45)';
    ctx.beginPath(); ctx.arc(cx, cy, 1.7, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(120,90,180,0.55)';
    ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.arc(cx, cy, 2.3, 0, Math.PI*2); ctx.stroke();
  } else if (type === 'sharingan'){
    ctx.fillStyle = '#c1121f';
    ctx.beginPath(); ctx.arc(cx, cy, 2.1, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    for (let k=0;k<3;k++){
      const a = k * Math.PI*2/3 - Math.PI/2;
      const px = cx + Math.cos(a)*1.1;
      const py = cy + Math.sin(a)*1.1;
      ctx.beginPath(); ctx.arc(px, py, 0.45, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.8)';

  } else {

    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(cx - 0.7, cy - 0.9, 0.7, 0, Math.PI*2); ctx.fill();
  }
}

function drawHead(s, blink){

    ctx.strokeStyle = 'rgba(70,45,30,0.5)';
    ctx.lineWidth = 0.9;
    for (let i=0;i<3;i++){
      ctx.beginPath();
      ctx.moveTo(-5.5, -1.5+i*2.4); ctx.lineTo(-9.5, -2.4+i*2.4);

      ctx.beginPath();
      ctx.moveTo( 5.5, -1.5+i*2.4); ctx.lineTo( 9.5, -2.4+i*2.4);

  if (s.id === 'itachi'){

    ctx.moveTo( 6,-1); ctx.lineTo( 4.5,4);

  if (s.diamond){

    ctx.beginPath();
    ctx.moveTo(0,-16); ctx.lineTo(2.6,-13.5); ctx.lineTo(0,-11); ctx.lineTo(-2.6,-13.5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.beginPath();
    ctx.moveTo(0,-15.4); ctx.lineTo(1.6,-13.5); ctx.lineTo(0,-11.6); ctx.lineTo(-1.6,-13.5);
    ctx.closePath(); ctx.fill();
  }

  drawHair(s);

  if (s.band && s.bandStyle !== 'sand' && s.id !== 'kakashi'){
    ctx.fillStyle = s.band;
    ctx.fillRect(-12.5, -10.5, 25, 5.5);
    ctx.fillStyle = s.metal;
    ctx.fillRect(-7, -11.5, 14, 7.5);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(-6, -10.5, 12, 1.6);
    if (s.bandStyle === 'leaf'){
      ctx.strokeStyle = '#5f6b78'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(0, -7.8, 2.1, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -9.9); ctx.lineTo(0, -5.7); ctx.stroke();
    }
  }
  if (s.id === 'gaara'){
    ctx.fillStyle = '#6b2a1a';
    ctx.fillRect(-12, -10.5, 24, 5.5);
    ctx.fillStyle = '#8b1a1a';
    ctx.beginPath(); ctx.arc(0, -7.8, 3.2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#c0392b';
    ctx.fillRect(-1, -10.5, 2, 5);

}
