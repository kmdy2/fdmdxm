/* ─── 阵营光环（保留） ─── */
function drawAura(f){
  if (!f.auraOn || f.state === 'dead') return;
  const isBlue = (f.pIndex === 1);
  const c1 = isBlue ? '77, 180, 255' : '255, 90, 90';
  const c2 = isBlue ? '77, 180, 255' : '255, 90, 90';

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const cx = f.x;
  const cy = f.y - 54;
  const t = time;
  const pulse = 0.9 + 0.1 * Math.sin(t*4 + (isBlue?0:Math.PI));

  const gg = ctx.createRadialGradient(f.x, GROUND+4, 0, f.x, GROUND+4, 48);
  gg.addColorStop(0,   `rgba(${c1}, 0.55)`);
  gg.addColorStop(0.5, `rgba(${c1}, 0.20)`);
  gg.addColorStop(1,   `rgba(${c1}, 0)`);
  ctx.fillStyle = gg;
  ctx.beginPath();
  ctx.ellipse(f.x, GROUND+4, 48*pulse, 11*pulse, 0, 0, Math.PI*2);
  ctx.fill();

  const bg = ctx.createRadialGradient(cx, cy, 8, cx, cy, 70*pulse);
  bg.addColorStop(0,   `rgba(${c2}, 0.28)`);
  bg.addColorStop(0.55,`rgba(${c2}, 0.10)`);
  bg.addColorStop(1,   `rgba(${c2}, 0)`);
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.ellipse(cx, cy, 42*pulse, 66*pulse, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.globalAlpha = 0.30 + 0.22 * Math.sin(t*5 + (isBlue?0:Math.PI));
  ctx.strokeStyle = isBlue ? '#5fb8ff' : '#ff5a5a';
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.ellipse(cx, cy, 36*pulse, 60*pulse, 0, 0, Math.PI*2);
  ctx.stroke();

  ctx.globalAlpha = 1;
  for (let i=0;i<4;i++){
    const ph = ((t*0.8 + i*0.25) % 1);
    const px = f.x + Math.sin((t+i)*2.2) * 26;
    const py = GROUND - ph * 100;
    const a = (1-ph) * 0.55;
    ctx.fillStyle = `rgba(${c2}, ${a})`;
    ctx.fillRect(px-1.5, py-1.5, 3, 3);
  }
  ctx.restore();
}

function drawFighter(f){
  const s = f.char.skin;
  const st = f.state;
  const prog = f.moveProgress || 0;
  const t = f.animTime;

  let legA = 0.08, legB = -0.08, kneeA = 0.10, kneeB = 0.10;
  let armA = 0.10, armB = -0.10, foreA = 0.20, foreB = 0.20;
  let lean = 0, hipY = BODY.hipY, headTilt = 0, headBob = 0;

  let blink = false;
  const blinkCycle = (t + f.pIndex*0.7) % 3.6;
  if (blinkCycle > 3.45) blink = true;

  if (st === 'idle'){
    const br = Math.sin(t*2.4);
    hipY += br * 0.8;
    headBob = -br * 0.6;
    armA += br * 0.06;
    armB -= br * 0.06;
    lean += Math.sin(t*1.2) * 0.015;
    armA -= Math.abs(Math.sin(t*0.9)) * 0.04;
  }
  else if (st === 'run'){
    const c = t * 14;
    const sp = Math.sin(c);
    const sp2 = Math.sin(c + Math.PI);
    legA = sp * 0.85;  legB = sp2 * 0.85;
    kneeA = Math.max(0, -sp) * 0.9;
    kneeB = Math.max(0, -sp2) * 0.9;
    armA = -sp * 0.8;  armB = -sp2 * 0.8;
    foreA = 0.6; foreB = 0.6;
    lean = 0.18;
    hipY += Math.abs(sp) * 1.8;
    headBob = -Math.abs(sp) * 1.2;
  }
  else if (st === 'jump'){
    if (f.vy < 0){
      legA = 0.75; legB = -0.55;
      kneeA = 1.0; kneeB = 0.3;
      armA = -1.0; armB = -0.9;
      foreA = -0.4; foreB = -0.4;
      lean = 0.10;
    } else {
      legA = 0.30; legB = -0.30;
      kneeA = 0.15; kneeB = 0.15;
      armA = 0.9; armB = 0.7;
      foreA = 0.3; foreB = 0.3;
      lean = -0.05;
    }
  }
  else if (st === 'hurt'){
    const k = 1 - Math.min(1, f.hurtTime / 0.28);
    const swing = Math.sin(k * Math.PI);
    lean = -0.35 - 0.15 * swing;
    legA = -0.30 - 0.10*swing; legB = 0.38 + 0.10*swing;
    kneeA = 0.25; kneeB = 0.10;
    armA = -0.95 - 0.15*swing; armB = -0.85;
    foreA = -0.5; foreB = -0.5;
    headTilt = -0.35 * swing;
    headBob = 2 * swing;
  }
  else if (st === 'guard'){
    lean = 0.24;
    legA = 0.35; legB = -0.35;
    kneeA = 0.30; kneeB = 0.30;
    armA = -1.30; armB = -1.15;
    foreA = -1.0; foreB = -1.0;
    hipY = BODY.hipY + 3;
    headBob = 1.5;
  }
  else if (st === 'dead'){
    lean = -1.5;
    legA = 0.5; legB = 0.9;
    kneeA = 0.3; kneeB = 0.4;
    armA = -1.2; armB = -1.0;
    foreA = -0.4; foreB = -0.3;
  }
  else if (f.move){
    const p = Math.min(1, prog);
    const strike = Math.sin(Math.min(1, p*1.7) * Math.PI);

    if (f.moveKey === 'atk1'){
      const w = Math.min(1, p / 0.5);
      armA = 0.10 + 1.5 * Math.sin(w * Math.PI);
      foreA = 0.0;
      armB = -0.20 - 0.3 * Math.sin(w * Math.PI);
      foreB = 0.6;
      lean = 0.12 * strike;
      legA = 0.35; legB = -0.30;
    }
    else if (f.moveKey === 'atk2'){
      const w = Math.min(1, p / 0.5);
      armB = 0.10 + 1.5 * Math.sin(w * Math.PI);
      foreB = 0.0;
      armA = -0.20 - 0.3 * Math.sin(w * Math.PI);
      foreA = 0.6;
      lean = 0.12 * strike;
      legA = -0.30; legB = 0.35;
    }
    else if (f.moveKey === 'atk3'){
      const w = Math.min(1, p / 0.55);
      armA = 0.10 + 2.0 * Math.sin(w * Math.PI);
      foreA = -0.15;
      armB = -0.10 - 0.5 * Math.sin(w * Math.PI);
      foreB = 0.4;
      lean = 0.20 * strike;
      legA = 0.55; legB = -0.40;
      kneeA = 0.5;
    }
    else if (f.moveKey === 's1' || f.moveKey === 's2' || f.moveKey === 's3'){
      const isUpper = (f.char.id === 'gaara' && f.moveKey === 's3') ||
                      (f.char.id === 'sakura' && f.moveKey === 's2');
      if (isUpper){
        armA = -1.5 - 0.3 * strike;
        foreA = -0.3;
        armB = -1.0;
        foreB = -0.3;
      } else {
        armA = 0.5 + 1.2 * strike;
        foreA = 0.0;
        armB = -0.5 - 0.5 * strike;
        foreB = 0.2;
      }
      lean = 0.15 * strike;
      legA = 0.45; legB = -0.35;
      kneeA = 0.2; kneeB = 0.3;
    }
    else if (f.move.ult){
      switch (f.char.id){
        case 'naruto':
          armA = 1.3; foreA = 0.15;
          armB = -1.3; foreB = -0.15;
          lean = 0.05 + strike * 0.15;
          legA = 0.5; legB = -0.5;
          kneeA = 0.4; kneeB = 0.4;
          break;
        case 'sasuke': {
          const w = Math.min(1, f.moveTime / 0.5);
          if (f.moveTime < 0.5){
            armA = -2.4 * w; foreA = 0.1;
            lean = -0.15 * w;
          } else {
            const w2 = Math.min(1, (f.moveTime - 0.5) / 0.22);
            armA = -2.4 + 3.6 * w2; foreA = 0.05;
            lean = -0.15 + 0.5 * w2;
          }
          armB = 0.4; foreB = 0.6;
          legA = 0.6; legB = -0.5;
          break;
        }
        case 'sakura': {
          if (f.moveTime < 0.9){
            const w = f.moveTime / 0.9;
            armA = -0.5 - w * 1.2; foreA = 0.3;
            lean = -w * 0.15;
          } else {
            armA = 1.9; foreA = 0.0;
            lean = 0.35;
          }
          legA = 0.7; legB = -0.55;
          kneeA = 0.5; kneeB = 0.3;
          break;
        }
        case 'kakashi': {
          if (f.moveTime < 0.9){
            armA = 1.35; foreA = -0.25;
            lean = 0.05;
          } else {
            armA = 1.85; foreA = 0.05;
            lean = 0.30;
          }
          armB = -0.4; foreB = 0.4;
          legA = 0.5; legB = -0.4;
          break;
        }
        case 'itachi': {
          if (f.moveTime < 0.6){
            armA = 1.0 + f.moveTime * 0.7; foreA = 0.15;
          } else {
            armA = 1.85; foreA = 0.05;
          }
          armB = -0.6; foreB = 0.5;
          lean = 0.18;
          legA = 0.5; legB = -0.4;
          break;
        }
        case 'neji':
          armA = 1.4; armB = -1.4;
          foreA = 0.1; foreB = -0.1;
          lean = 0.05;
          legA = 0.5; legB = -0.5;
          kneeA = 0.35; kneeB = 0.35;
          break;
        case 'gaara':
          armA = 1.6; armB = -1.6;
          foreA = 0.2; foreB = -0.2;
          lean = 0.03;
          legA = 0.3; legB = -0.3;
          break;
        case 'gai': {
          if (f.moveTime < 0.4){
            armA = -0.9 - f.moveTime * 1.2; foreA = 0.3;
            lean = -0.2;
          } else if (f.moveTime < 0.7){
            armA = 1.5; foreA = 0.05;
            lean = 0.25;
          } else if (f.moveTime < 1.0){
            armA = 1.9; foreA = 0.05;
            lean = 0.35;
          } else {
            armA = 2.1; foreA = 0.05;
            lean = 0.40;
          }
          armB = -0.5; foreB = 0.4;
          legA = 0.8; legB = -0.6;
          kneeA = 0.6; kneeB = 0.3;
          break;
        }
      }
    }
  }

  drawAura(f);

  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.scale(f.facing, 1);

  if (f.rageBuff > 0){
    ctx.save();
    ctx.globalAlpha = 0.20 + 0.15*Math.sin(time*12);
    ctx.strokeStyle = '#ff2b7f';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(0, -54, 40, 70, 0, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  drawLegFull(-5, hipY, legB, kneeB, s, true);

  ctx.save();
  ctx.translate(0, hipY);
  ctx.rotate(lean);
  drawArmFull(-9, -34, armB, foreB, s, true);
  drawTorso(s);
  ctx.restore();

  drawLegFull(5, hipY, legA, kneeA, s, false);

  ctx.save();
  ctx.translate(0, hipY);
  ctx.rotate(lean);

  const armResult = drawArmFull(9, -34, armA, foreA, s, false);

  if (f.char.id === 'sakura' && f.moveKey === 'ult' && f.moveTime > 0.45){
    ctx.save();
    ctx.globalAlpha = 0.9;
    for (let i=0;i<3;i++){
      const r = 8 + i*5 + Math.sin(time*18+i)*2;
      ctx.strokeStyle = i===0 ? '#fff' : '#ff2b7f';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(armResult.ex, armResult.ey, r, 0, Math.PI*2);
      ctx.stroke();
    }
    ctx.restore();
  }

  ctx.save();
  ctx.translate(0, -46 + headBob);
  ctx.rotate(headTilt * 0.4);
  drawHead(s, blink);
  ctx.restore();

  ctx.restore();
  ctx.restore();

  if (f.sealTime > 0){
    ctx.save();
    ctx.globalAlpha = 0.65 + 0.30*Math.sin(time*22);
    ctx.strokeStyle = '#c0392b';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(f.x, f.y-54, 40, 74, 0, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#ffd93b';
    for (let i=0;i<6;i++){
      const a = time*3 + i*Math.PI/3;
      const px = f.x + Math.cos(a)*38;
      const py = f.y - 54 + Math.sin(a)*70;
      ctx.fillRect(px-2, py-3, 4, 6);
    }
    ctx.restore();
  }

  if (f.flash > 0){
    ctx.save();
    ctx.globalAlpha = f.flash*6;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle='#fff';
    const hb = f.getHurtbox();
    rrect(hb.x, hb.y, hb.w, hb.h, 10); ctx.fill();
    ctx.restore();
  }

  if (f.guarding){
    const ratio = clamp(f.guardBreak/100, 0, 1);
    const r = Math.round(140 + ratio*180);
    const g = Math.round(205 - ratio*150);
    const b = Math.round(255 - ratio*180);
    ctx.save();
    ctx.globalAlpha = 0.30 + 0.18*Math.sin(time*14);
    ctx.strokeStyle = `rgb(${r},${g},${b})`;
    ctx.lineWidth = 3 + ratio*2;
    ctx.beginPath();
    ctx.ellipse(f.x, f.y-54, 34+ratio*3, 62+ratio*3, 0, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  if (f.chakra >= 100 && f.state !== 'dead'){
    ctx.save();
    ctx.globalAlpha = 0.22 + 0.14*Math.sin(time*7);
    const ultColor = f.char.skills[3].color;
    const g = ctx.createRadialGradient(f.x, f.y-54, 4, f.x, f.y-54, 62);
    g.addColorStop(0, ultColor); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(f.x, f.y-54, 62, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  if (f.superArmor > 0){
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.30*Math.sin(time*24);
    ctx.strokeStyle='#ffd93b';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(f.x, f.y-54, 38, 70, 0, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  if (f.invuln > 0){
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.3*Math.sin(time*40);
    ctx.strokeStyle='#fff3b0';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(f.x, f.y-54, 32, 64, 0, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}

/* ═══════════════════════════════════════════════════════
   背景 / 影子 / 分身 / 粒子 / 装饰 / 区域 / 弹道
   ═══════════════════════════════════════════════════════ */
function drawBackground(){
  ctx.fillStyle = GRAD.bg;
  ctx.fillRect(0,0,W,GROUND);
  ctx.fillStyle='rgba(255,255,255,.6)';
  for(let i=0;i<30;i++){ ctx.fillRect((i*73)%W,(i*41)%200,1,1); }
  ctx.save();
  ctx.shadowBlur=70; ctx.shadowColor='rgba(255,215,150,0.55)';
  ctx.fillStyle='#ffeaa7';
  ctx.beginPath(); ctx.arc(770,108,54,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.06)';
  for(let i=0;i<4;i++){
    const cx=((i*250+time*8)%(W+200))-100, cy=40+i*30;
    ctx.beginPath(); ctx.ellipse(cx,cy,60,10,0,0,Math.PI*2); ctx.fill();
  }
  ctx.fillStyle='#0b1524';
  ctx.beginPath(); ctx.moveTo(0,GROUND);
  const peaks=[[70,310],[180,368],[300,282],[430,345],[560,262],[700,332],[840,288],[960,340]];
  for (const [px,py] of peaks) ctx.lineTo(px,py);
  ctx.lineTo(W,GROUND); ctx.closePath(); ctx.fill();

  ctx.fillStyle='#080f1a';
  ctx.fillRect(60,300,150,GROUND-300);
  ctx.fillRect(70,282,40,22); ctx.fillRect(120,276,40,28);
  ctx.fillRect(170,288,34,16); ctx.fillRect(86,268,26,18);

  ctx.fillStyle='#070c15';
  for (const [bx,bh] of [[300,120],[340,96],[640,132],[690,104],[880,118]]){
    ctx.beginPath(); ctx.moveTo(bx-34,GROUND); ctx.lineTo(bx,GROUND-bh); ctx.lineTo(bx+34,GROUND);
    ctx.closePath(); ctx.fill();
    ctx.fillRect(bx-4, GROUND-bh*0.4, 8, bh*0.4);
  }
  ctx.fillStyle = GRAD.ground;
  ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='rgba(255,190,90,0.09)'; ctx.fillRect(0,GROUND,W,3);
  ctx.strokeStyle='rgba(255,255,255,0.035)'; ctx.lineWidth=1;
  for (let i=0;i<14;i++){
    const y=GROUND+12+i*6;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
}

function drawShadows(){
  for (const f of [p1,p2]){
    if (!f) continue;
    const h = f.y - GROUND;
    const sc = clamp(1+h/300, 0.42, 1);
    ctx.save();
    ctx.globalAlpha = 0.34*sc; ctx.fillStyle='#000';
    ctx.beginPath(); ctx.ellipse(f.x, GROUND+5, 27*sc, 8*sc, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function drawClones(){
  for (const c of clones){
    const a = (c.life/c.maxLife)*0.55;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(c.x, c.y); ctx.scale(c.facing, 1);
    ctx.fillStyle = c.color;
    rrect(-10,-80,20,44,6); ctx.fill();
    ctx.beginPath(); ctx.arc(0,-90,11,0,Math.PI*2); ctx.fill();
    if (c.skin){
      ctx.fillStyle = c.skin.hair;
      ctx.beginPath(); ctx.arc(0,-94,10,Math.PI,Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = c.skin ? c.skin.pants : '#333';
    ctx.fillRect(-9,-38,7,34); ctx.fillRect(2,-38,7,34);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawParticles(){
  for (const p of particles){
    ctx.globalAlpha = clamp(p.life/p.maxLife, 0, 1);
    if (p.ring){
      const prog = 1-p.life/p.maxLife;
      ctx.strokeStyle = p.color; ctx.lineWidth = 3*(1-prog);
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*prog,0,Math.PI*2); ctx.stroke();
    } else {
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
    }
  }
  ctx.globalAlpha = 1;
}

function drawDecos(){
  for (const d of decos){
    const a = clamp(d.life/d.maxLife, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    if (d.type === 'charge'){
      const prog = 1-d.life/d.maxLife;
      const r = d.maxR * Math.min(1, prog*1.4);
      const g = ctx.createRadialGradient(d.x, d.y, 2, d.x, d.y, r);
      g.addColorStop(0, '#000');
      g.addColorStop(0.55, '#2a0a3a');
      g.addColorStop(1, 'rgba(255,107,53,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(d.x, d.y, r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle='#ff6b35'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(d.x, d.y, r*0.9, time*10, time*10+Math.PI*1.5); ctx.stroke();
    }
    else if (d.type === 'susanooAura'){
      ctx.strokeStyle = d.color; ctx.lineWidth = 3;
      ctx.globalAlpha = a*0.7;
      const cx = d.x, cy = d.y - 30;
      ctx.beginPath();
      ctx.moveTo(cx-50, cy+10);
      ctx.lineTo(cx-30, cy-114);
      ctx.lineTo(cx, cy-190);
      ctx.lineTo(cx+30, cy-114);
      ctx.lineTo(cx+50, cy+10);
      ctx.stroke();
      for (let i=0;i<4;i++){
        const yy = cy - 30 - i*30;
        ctx.beginPath();
        ctx.moveTo(cx-32+i*3, yy);
        ctx.quadraticCurveTo(cx, yy+8, cx+32-i*3, yy);
        ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(cx, cy-194, 12, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle='#ffd93b';
      ctx.beginPath(); ctx.arc(cx-5, cy-196, 2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+5, cy-196, 2, 0, Math.PI*2); ctx.fill();
    }
    else if (d.type === 'byakugoAura'){
      ctx.strokeStyle = d.color; ctx.lineWidth = 4;
      ctx.shadowBlur = 24; ctx.shadowColor = d.color;
      for (let i=0;i<4;i++){
        const r = 40 + i*14 + (1-d.life/d.maxLife)*20;
        ctx.beginPath(); ctx.arc(d.x, d.y, r, 0, Math.PI*2); ctx.stroke();
      }
      ctx.shadowBlur = 0;
    }
    else if (d.type === 'tsukuyomi'){
      ctx.strokeStyle = d.color; ctx.lineWidth = 3;
      ctx.shadowBlur = 30; ctx.shadowColor = d.color;
      for (let i=0;i<3;i++){
        const r = 60 + i*40 + (1-d.life/d.maxLife)*80;
        ctx.beginPath(); ctx.arc(d.x, d.y, r, 0, Math.PI*2); ctx.stroke();
      }
      ctx.fillStyle = '#c1121f';
      for (let i=0;i<3;i++){
        const a2 = i*2.094 + time*2;
        ctx.beginPath();
        ctx.arc(d.x+Math.cos(a2)*80, d.y+Math.sin(a2)*80, 10, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
    }
    else if (d.type === 'totsukaBlade'){
      const prog = 1-d.life/d.maxLife;
      const ext = Math.min(1, prog*2.2);
      ctx.translate(d.x, d.y);
      ctx.scale(d.facing, 1);
      ctx.fillStyle = '#e8d8b0';
      ctx.shadowBlur = 30; ctx.shadowColor='#c0392b';
      ctx.beginPath();
      ctx.moveTo(0, -8);
      ctx.lineTo(d.length*ext, -4);
      ctx.lineTo(d.length*ext+16, 0);
      ctx.lineTo(d.length*ext, 4);
      ctx.lineTo(0, 8);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#4a1a1a';
      ctx.fillRect(-12, -6, 16, 12);
      ctx.shadowBlur = 0;
    }
    else if (d.type === 'rotationDome'){
      ctx.strokeStyle = d.color; ctx.lineWidth = 3;
      ctx.shadowBlur = 20; ctx.shadowColor = d.color;
      for (let i=0;i<3;i++){
        const r = d.r + i*6;
        ctx.beginPath(); ctx.arc(d.x, d.y, r, Math.PI, 0); ctx.stroke();
      }
      for (let i=0;i<6;i++){
        const a2 = time*12 + i*1.047;
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r-6, a2, a2+0.7);
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
    }
    else if (d.type === 'barrage'){
      for (let i=0;i<12;i++){
        const a2 = i*0.524 + time*6;
        const r = 40 + i*6;
        const px = d.x + Math.cos(a2)*r;
        const py = d.y + Math.sin(a2)*r*0.7;
        ctx.fillStyle = '#b8e8ff';
        ctx.globalAlpha = a * (0.4 + 0.5*Math.abs(Math.sin(time*18 + i)));
        ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI*2); ctx.fill();
      }
    }
    else if (d.type === 'hakkeArray'){
      const cx = d.x, cy = d.y;
      ctx.strokeStyle = '#e0f4ff';
      ctx.lineWidth = 2;
      ctx.shadowBlur = 20; ctx.shadowColor = '#e0f4ff';
      ctx.beginPath(); ctx.ellipse(cx, cy-6, d.r, d.r*0.28, 0, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(cx, cy-6, d.r*0.62, d.r*0.18, 0, 0, Math.PI*2); ctx.stroke();
      for (let i=0;i<8;i++){
        const a2 = i*Math.PI/4;
        const ex = cx + Math.cos(a2)*d.r;
        const ey = cy-6 + Math.sin(a2)*d.r*0.28;
        ctx.beginPath(); ctx.moveTo(cx, cy-6); ctx.lineTo(ex, ey); ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(cx, cy-6, 14, 0, Math.PI*2); ctx.stroke();
      for (let i=0;i<8;i++){
        const a2 = i*Math.PI/4 + time*1.6;
        const rr = d.r * 0.8;
        const px = cx + Math.cos(a2)*rr;
        const py = cy-6 + Math.sin(a2)*rr*0.28;
        ctx.fillStyle = '#ffffff';
        ctx.globalAlpha = a*0.85;
        ctx.fillRect(px-3, py-3, 6, 6);
      }
      ctx.shadowBlur = 0;
    }
    else if (d.type === 'sandPrison'){
      for (let i=0;i<20;i++){
        const a2 = i*0.314 + time*2;
        const px = d.x + Math.cos(a2)*30;
        const py = d.y - 40 - Math.sin(i)*30 + Math.sin(time*8+i)*4;
        ctx.fillStyle = '#c8a878';
        ctx.globalAlpha = a * 0.8;
        ctx.fillRect(px-4, py, 8, 10);
      }
    }
    else if (d.type === 'sandWave'){
      ctx.translate(d.x, d.y);
      ctx.scale(d.facing, 1);
      const prog = 1-d.life/d.maxLife;
      const waveH = 80 + prog*50;
      ctx.fillStyle = '#a88858';
      ctx.globalAlpha = a*0.85;
      for (let i=0;i<12;i++){
        const x = i*12 + Math.sin(time*10 + i)*3;
        const h = waveH * (1 - i*0.06);
        ctx.fillRect(x, -h, 14, h);
      }
      ctx.fillStyle = '#e8d8b0';
      ctx.globalAlpha = a*0.55;
      for (let i=0;i<8;i++){
        const x = i*18 + Math.sin(time*12 + i*1.3)*4;
        ctx.fillRect(x, -waveH*0.7, 8, 6);
      }
    }
    else if (d.type === 'sandDome'){
      ctx.strokeStyle = d.color; ctx.lineWidth = 4;
      for (let i=0;i<3;i++){
        const r = d.r + i*8;
        ctx.beginPath(); ctx.arc(d.x, d.y, r, Math.PI, 0); ctx.stroke();
      }
    }
    else if (d.type === 'shukakuEye'){
      ctx.translate(d.x, d.y);
      ctx.scale(d.facing, 1);
      ctx.strokeStyle = d.color; ctx.lineWidth = 3;
      ctx.shadowBlur = 20; ctx.shadowColor = d.color;
      ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = '#1a1a2e';
      ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = d.color;
      ctx.globalAlpha = a*0.9;
      for (let i=0;i<6;i++){
        const a2 = i*Math.PI/3 + time*0.6;
        const px = Math.cos(a2)*24;
        const py = Math.sin(a2)*24;
        ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI*2); ctx.fill();
      }
      ctx.shadowBlur = 0;
    }
    else if (d.type === 'impactRing'){
      const prog = 1-d.life/d.maxLife;
      ctx.strokeStyle = d.color; ctx.lineWidth = 4*(1-prog);
      ctx.beginPath(); ctx.arc(d.x, d.y, d.maxR*prog, 0, Math.PI*2); ctx.stroke();
    }
    else if (d.type === 'healAura'){
      ctx.strokeStyle = d.color; ctx.lineWidth = 3;
      ctx.shadowBlur = 18; ctx.shadowColor = d.color;
      for (let i=0;i<3;i++){
        const r = d.r - i*10 + Math.sin(time*8+i)*3;
        ctx.beginPath(); ctx.arc(d.x, d.y, r, 0, Math.PI*2); ctx.stroke();
      }
      ctx.shadowBlur = 0;
    }
    else if (d.type === 'crack'){
      ctx.translate(d.x, d.y);
      ctx.scale(d.facing, 1);
      ctx.strokeStyle = d.color; ctx.lineWidth = 3;
      ctx.shadowBlur = 12; ctx.shadowColor = d.color;
      for (let i=0;i<6;i++){
        ctx.beginPath();
        ctx.moveTo(0, 0);
        const dx = 30 + i*20;
        const dy = -8 + i*4;
        ctx.lineTo(dx, dy);
        ctx.lineTo(dx + 15, dy - 4);
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
    }
    else if (d.type === 'kickArc'){
      ctx.strokeStyle = d.color; ctx.lineWidth = 5;
      ctx.shadowBlur = 18; ctx.shadowColor = d.color;
      ctx.translate(d.x, d.y);
      ctx.scale(d.facing, 1);
      ctx.beginPath();
      ctx.arc(0, 0, 60, -Math.PI*0.6, Math.PI*0.6);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    else if (d.type === 'palmWave'){
      const prog = 1-d.life/d.maxLife;
      ctx.strokeStyle = d.color; ctx.lineWidth = 4*(1-prog);
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r + prog*20, 0, Math.PI*2); ctx.stroke();
    }
    else if (d.type === 'steamAura'){
      ctx.strokeStyle = d.color; ctx.lineWidth = 4;
      ctx.shadowBlur = 22; ctx.shadowColor = d.color;
      for (let i=0;i<4;i++){
        const r = d.r + i*12 + Math.sin(time*12+i)*4;
        ctx.globalAlpha = a * (0.5 - i*0.1);
        ctx.beginPath(); ctx.arc(d.x, d.y, r, 0, Math.PI*2); ctx.stroke();
      }
      ctx.shadowBlur = 0;
    }
    else if (d.type === 'afterImage'){
      ctx.globalAlpha = a*0.55;
      ctx.fillStyle = d.color;
      for (let i=0;i<4;i++){
        ctx.globalAlpha = a * (0.5 - i*0.1);
        ctx.fillRect(d.x - 12 + i*2, d.y - 100 + i*6, 24, 100 - i*10);
      }
    }
    else if (d.type === 'dragonAura'){
      ctx.strokeStyle = d.color; ctx.lineWidth = 6;
      ctx.shadowBlur = 30; ctx.shadowColor = d.color;
      ctx.translate(d.x, d.y);
      ctx.scale(d.facing, 1);
      ctx.beginPath();
      for (let i=0;i<20;i++){
        const px = i*14;
        const py = Math.sin(i*0.6 + time*8)*20;
        if (i===0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.fillStyle = '#ffd93b';
      ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }
}

function drawHazards(){
  for (const h of hazards){
    const a = clamp(h.life/h.maxLife, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    if (h.type === 'orb'){
      const g = ctx.createRadialGradient(h.x, h.y, 2, h.x, h.y, h.r);
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, h.color);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=2;
      for (let k=0;k<3;k++){
        const a2 = time*14 + k*2.094;
        ctx.beginPath(); ctx.arc(h.x, h.y, h.r*0.55, a2, a2+Math.PI*1.2); ctx.stroke();
      }
    }
    else if (h.type === 'odama'){
      const g = ctx.createRadialGradient(h.x, h.y, 3, h.x, h.y, h.r);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.3, h.color);
      g.addColorStop(0.7, 'rgba(77,166,255,0.6)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=3;
      for (let k=0;k<4;k++){
        const a2 = time*20 + k*1.571;
        ctx.beginPath(); ctx.arc(h.x, h.y, h.r*0.7, a2, a2+Math.PI*1.4); ctx.stroke();
      }
    }
    else if (h.type === 'bolt' || h.type === 'chidoriArm' || h.type === 'raikiriArm'){
      const t2 = h.type === 'chidoriArm' ? 2 : (h.type === 'raikiriArm' ? 3 : 3);
      ctx.strokeStyle = h.color; ctx.lineWidth = t2;
      ctx.shadowBlur = 18; ctx.shadowColor = h.color;
      ctx.beginPath();
      let px = h.x - 60, py = h.y;
      ctx.moveTo(px, py);
      for (let i=0;i<6;i++){
        px += 20; py = h.y + rand(-18,18);
        ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    else if (h.type === 'amaterasu'){
      for (let i=0;i<16;i++){
        const px = h.x + rand(-h.r*0.9, h.r*0.9);
        const py = GROUND - ((time*80 + i*40) % 150);
        ctx.fillStyle = i%2 ? '#0d0d1a' : '#2a1a4a';
        ctx.fillRect(px-4, py, 8, 16);
      }
      ctx.fillStyle = 'rgba(10,10,26,.65)';
      ctx.beginPath();
      ctx.ellipse(h.x, GROUND-8, h.r*0.95, 18, 0, 0, Math.PI*2);
      ctx.fill();
    }
    else if (h.type === 'kamui'){
      ctx.strokeStyle = h.color; ctx.lineWidth = 2.5;
      ctx.shadowBlur = 18; ctx.shadowColor = h.color;
      for (let k=0;k<5;k++){
        const a2 = time*8 + k*1.257;
        ctx.beginPath();
        ctx.arc(h.x, h.y, h.r*0.2 + k*10, a2, a2 + Math.PI*1.3);
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(30,0,50,.7)';
      ctx.beginPath(); ctx.arc(h.x, h.y, h.r*0.28, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }
}

function drawProjectiles(){
  for (const pr of projectiles){
    ctx.save();
    ctx.globalAlpha = clamp(pr.life/pr.maxLife, 0, 1);
    if (pr.kind === 'rasenshuriken'){
      ctx.translate(pr.x, pr.y); ctx.rotate(pr.spin);
      ctx.fillStyle = pr.color;
      ctx.shadowBlur = 22; ctx.shadowColor = pr.color;
      for (let k=0;k<4;k++){
        ctx.rotate(Math.PI/2);
        ctx.beginPath();
        ctx.moveTo(0,0); ctx.lineTo(pr.size, -8); ctx.lineTo(pr.size*0.5, 0);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(0,0, pr.size*0.4, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }
    else if (pr.kind === 'bijudama'){
      const r = pr.size;
      const g = ctx.createRadialGradient(pr.x, pr.y, 2, pr.x, pr.y, r);
      g.addColorStop(0, '#000'); g.addColorStop(0.35, '#2a0a3a');
      g.addColorStop(0.65, '#8b1a1a'); g.addColorStop(0.9, '#ff6b35');
      g.addColorStop(1, 'rgba(255,107,53,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(pr.x, pr.y, r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#ffd93b'; ctx.lineWidth = 3;
      ctx.shadowBlur = 20; ctx.shadowColor = '#ff6b35';
      for (let k=0;k<3;k++){
        const a2 = pr.spin*0.5 + k*2.094;
        ctx.beginPath();
        ctx.arc(pr.x, pr.y, r*1.15, a2, a2+Math.PI*1.1);
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,107,53,.4)';
      for (let i=1;i<5;i++){
        ctx.globalAlpha = 0.4/i;
        ctx.beginPath();
        ctx.arc(pr.x - Math.sign(pr.vx)*i*18, pr.y, r*(1-i*0.12), 0, Math.PI*2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
    }
    else if (pr.kind === 'indraArrow'){
      ctx.translate(pr.x, pr.y);
      ctx.scale(Math.sign(pr.vx)||1, 1);
      ctx.fillStyle = '#a06bff';
      ctx.shadowBlur = 30; ctx.shadowColor = '#a06bff';
      ctx.beginPath();
      ctx.moveTo(-pr.size, 0);
      ctx.lineTo(0, -pr.size*0.7);
      ctx.lineTo(pr.size*1.6, 0);
      ctx.lineTo(0, pr.size*0.7);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e0c0ff';
      ctx.beginPath();
      ctx.arc(0, 0, pr.size*0.4, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    else if (pr.kind === 'sandTsunami'){
      ctx.translate(pr.x, pr.y + 40);
      ctx.scale(Math.sign(pr.vx)||1, 1);
      ctx.fillStyle = '#a88858';
      for (let i=-8;i<6;i++){
        const x = i*14;
        const h = 60 + Math.sin(time*8+i*0.5)*14;
        ctx.fillRect(x, -h, 16, h+20);
      }
      ctx.fillStyle = '#c8a878';
      for (let i=-6;i<5;i++){
        const x = i*18;
        const h = 40 + Math.sin(time*10+i*0.7)*10;
        ctx.fillRect(x, -h-10, 12, h);
      }
    }
    else if (pr.kind === 'waterBead'){
      const g = ctx.createRadialGradient(pr.x, pr.y, 1, pr.x, pr.y, pr.size);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.4, pr.color);
      g.addColorStop(1, 'rgba(78,200,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.size, 0, Math.PI*2); ctx.fill();
    }
    else if (pr.kind === 'dragonFire'){
      const g = ctx.createRadialGradient(pr.x, pr.y, 2, pr.x, pr.y, pr.size*1.6);
      g.addColorStop(0, '#fff');
      g.addColorStop(0.35, '#ffd93b');
      g.addColorStop(0.7, '#ff6b35');
      g.addColorStop(1, 'rgba(255,107,53,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.size*1.6, 0, Math.PI*2); ctx.fill();
      /* 拖尾 */
      for (let i=1;i<4;i++){
        ctx.globalAlpha = 0.5/i;
        ctx.beginPath();
        ctx.arc(pr.x - Math.sign(pr.vx)*i*14, pr.y - Math.sin((pr.wavePhase||0)+i)*4, pr.size*(1.2-i*0.2), 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    else if (pr.kind === 'crow'){
      ctx.translate(pr.x, pr.y);
      ctx.scale(Math.sign(pr.vx)||1, 1);
      ctx.fillStyle = pr.color;
      const wing = Math.sin(time*20 + (pr.wavePhase||0))*4;
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(-12, -6+wing); ctx.lineTo(-6, 0);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(-12, 6-wing); ctx.lineTo(-6, 0);
      ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0, 0, 6, 4, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#c1121f';
      ctx.fillRect(2, -2, 2, 2);
    }
    else if (pr.kind === 'bigFire'){
      const g = ctx.createRadialGradient(pr.x, pr.y, 2, pr.x, pr.y, pr.size);
      g.addColorStop(0, '#fff');
      g.addColorStop(0.3, '#ffd93b');
      g.addColorStop(0.6, pr.color);
      g.addColorStop(1, 'rgba(255,140,26,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.size, 0, Math.PI*2); ctx.fill();
    }
    else if (pr.kind === 'tiger'){
      const g = ctx.createRadialGradient(pr.x, pr.y, 2, pr.x, pr.y, pr.size);
      g.addColorStop(0, '#fff'); g.addColorStop(0.5, pr.color);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.size, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.size*0.7, 0, Math.PI*2); ctx.stroke();
    }
    else {
      ctx.fillStyle = pr.color;
      ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.size, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.size*0.55, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

function drawTexts(){
  ctx.save();
  ctx.textAlign = 'center';
  for (const t of texts){
    ctx.globalAlpha = clamp(t.life, 0, 1);
    ctx.font = `bold ${t.size}px "Courier New",monospace`;
    ctx.lineWidth = 5; ctx.strokeStyle='rgba(0,0,0,0.85)';
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════
   HUD（血条数字同步 2000 上限）
   ═══════════════════════════════════════════════════════ */
function drawHealthBar(x,y,w,h,f,rightAlign){
  const r = clamp(f.hp/f.maxHp, 0, 1);
  const lag = clamp(f.hpLag, 0, 1);
  ctx.save();
  ctx.shadowBlur = 12; ctx.shadowColor='rgba(255,100,50,.5)';
  ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(x-3, y-3, w+6, h+6);
  ctx.fillStyle='#242a36'; ctx.fillRect(x, y, w, h);

  const lw=w*lag, lx=rightAlign?x+w-lw:x;
  ctx.fillStyle='rgba(255,225,130,0.8)'; ctx.fillRect(lx, y, lw, h);

  const fw=w*r, fx=rightAlign?x+w-fw:x;
  ctx.fillStyle = GRAD.hp;
  ctx.fillRect(fx, y, fw, h);
  ctx.fillStyle='rgba(255,255,255,0.3)';
  ctx.fillRect(fx, y, fw, h*0.36);

  /* 破防值细条 */
  const gb = clamp(f.guardBreak/100, 0, 1);
  if (gb > 0){
    const gw = w*gb;
    const gx = rightAlign ? x+w-gw : x;
    const g2 = ctx.createLinearGradient(0, y+h+2, 0, y+h+6);
    g2.addColorStop(0, '#ffb84d'); g2.addColorStop(1, '#ff3030');
    ctx.fillStyle = g2;
    ctx.fillRect(gx, y+h+2, gw, 4);
  }

  if (f.sealTime > 0){
    ctx.fillStyle = '#c0392b';
    ctx.fillRect(x, y-8, w, 4);
  }

  ctx.strokeStyle='rgba(255,200,110,0.8)'; ctx.lineWidth=1.5;
  ctx.strokeRect(x-1.5, y-1.5, w+3, h+3);
  ctx.restore();

  /* 血量数字（2000 上限） */
  const hpNow = Math.max(0, Math.round(f.hp));
  ctx.save();
  ctx.font = 'bold 14px "Courier New",monospace';
  ctx.textAlign = rightAlign ? 'left' : 'right';
  ctx.textBaseline = 'middle';
  const tx = rightAlign ? (x + w + 14) : (x - 14);
  const ty = y + h/2 + 1;
  ctx.lineWidth = 3.5;
  ctx.strokeStyle = 'rgba(0,0,0,0.9)';
  ctx.strokeText(`${hpNow}/${f.maxHp}`, tx, ty);
  ctx.fillStyle = '#ffd9b0';
  ctx.fillText(`${hpNow}/${f.maxHp}`, tx, ty);
  ctx.restore();
}
function drawChakraBar(x,y,w,h,f,rightAlign){
  const r = clamp(f.chakra/f.maxChakra, 0, 1);
  ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(x-2, y-2, w+4, h+4);
  ctx.fillStyle='#1a2130'; ctx.fillRect(x, y, w, h);
  const fw=w*r, fx=rightAlign?x+w-fw:x;
  ctx.fillStyle = GRAD.chakra;
  ctx.fillRect(fx, y, fw, h);
  if (r >= 1){
    ctx.globalAlpha = 0.35 + 0.35*Math.abs(Math.sin(time*6));
    ctx.fillStyle='#fff'; ctx.fillRect(fx, y, fw, h);
    ctx.globalAlpha = 1;
  }
  ctx.strokeStyle='rgba(130,200,255,0.5)'; ctx.lineWidth=1.2;
  ctx.strokeRect(x-1, y-1, w+2, h+2);
}
function drawNameTag(x,y,text,sub,color,rightAlign){
  ctx.textAlign = rightAlign ? 'right' : 'left';
  ctx.font = 'bold 16px "Courier New",monospace';
  ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillText(text, x+1, y+1);
  ctx.fillStyle=color; ctx.fillText(text, x, y);
  if (sub){
    ctx.font = 'bold 11px "Courier New",monospace';
    ctx.fillStyle='rgba(255,255,255,0.45)';
    ctx.fillText(sub, x, y+16);
  }
}
function drawCombo(f, cx){
  if (f.combo > 1 && f.comboTimer > 0){
    const a = clamp(f.comboTimer, 0, 1);
    ctx.save();
    ctx.textAlign='center'; ctx.globalAlpha = a;
    ctx.font = 'bold 34px "Courier New",monospace';
    ctx.lineWidth = 6; ctx.strokeStyle='rgba(0,0,0,0.75)';
    ctx.strokeText(`${f.combo} 连击`, cx, 178);
    ctx.fillStyle='#ffd93b'; ctx.fillText(`${f.combo} 连击`, cx, 178);
    ctx.restore();
  }
}
function drawHUD(){
  drawHealthBar(30, 30, 340, 22, p1, false);
  drawChakraBar(30, 62, 296, 10, p1, false);
  drawNameTag(30, 92, '1P · '+p1.char.name, p1.char.tag, '#5fb8ff', false);

  drawHealthBar(W-30-340, 30, 340, 22, p2, true);
  drawChakraBar(W-30-296, 62, 296, 10, p2, true);
  const p2label = mode === 'pve' ? 'CPU · '+p2.char.name : '2P · '+p2.char.name;
  drawNameTag(W-30, 92, p2label, p2.char.tag, '#ff5a5a', true);

  drawCombo(p1, 190); drawCombo(p2, W-190);

  if (p1.chakra >= 100){
    ctx.save(); ctx.textAlign='center';
    ctx.globalAlpha = 0.5 + 0.45*Math.abs(Math.sin(time*5));
    ctx.font='bold 14px "Courier New",monospace';
    ctx.fillStyle='#5fb8ff';
    ctx.fillText('1P 奥义就绪 [U]', 190, 505);
    ctx.restore();
  }
  if (p2.chakra >= 100){
    ctx.save(); ctx.textAlign='center';
    ctx.globalAlpha = 0.5 + 0.45*Math.abs(Math.sin(time*5));
    ctx.font='bold 14px "Courier New",monospace';
    ctx.fillStyle='#ff5a5a';
    ctx.fillText('2P 奥义就绪 [0]', W-190, 505);
    ctx.restore();
  }
}

/* ═══════════════════════════════════════════════════════
   选人 / 标题 / 结算
   ═══════════════════════════════════════════════════════ */
const CARD_W=128, CARD_H=244, CARD_GAP=14, CARD_Y=118;
const cols=4;
const totalW = cols*CARD_W + (cols-1)*CARD_GAP;
const startX = (W-totalW)/2;
const cardX = i => startX + (i%cols)*(CARD_W+CARD_GAP);
const cardY = i => CARD_Y + Math.floor(i/cols)*(CARD_H+26);
let previewFighters = null;
function getPreview(i){
  if (!previewFighters) previewFighters = [];
  if (!previewFighters[i]){
    previewFighters[i] = new Fighter({char:CHARACTERS[i], isPlayer:true, pIndex:1, x:0, y:0, facing:1});
  }
  return previewFighters[i];
}
function drawSelectScreen(){
  ctx.fillStyle = GRAD.select; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.save();
  ctx.shadowBlur=26; ctx.shadowColor='#ff8c1a';
  ctx.fillStyle='#ffd93b'; ctx.font='bold 30px "Courier New",monospace';
  ctx.fillText('选 择 忍 者', W/2, 60);
  ctx.restore();
  for (let i=0;i<CHARACTERS.length;i++){
    const ch=CHARACTERS[i];
    const x=cardX(i), y=cardY(i);
    const isP1 = sel.p1 === i, isP2 = sel.p2 === i;
    ctx.fillStyle='rgba(16,24,42,0.92)';
    rrect(x, y, CARD_W, CARD_H, 10); ctx.fill();
    let borderCol = 'rgba(255,255,255,0.10)';
    if (isP1&&isP2) borderCol='#c060ff';
    else if (isP1) borderCol='#5fb8ff';
    else if (isP2) borderCol='#ff5a5a';
    ctx.strokeStyle=borderCol;
    ctx.lineWidth = (isP1||isP2) ? 3 : 1.5;
    rrect(x, y, CARD_W, CARD_H, 10); ctx.stroke();
    if (isP1 || isP2){
      ctx.save();
      ctx.globalAlpha = 0.18 + 0.10*Math.sin(time*6);
      ctx.fillStyle=borderCol;
      rrect(x, y, CARD_W, CARD_H, 10); ctx.fill();
      ctx.restore();
    }
    const pf=getPreview(i);
    pf.animTime = time + i*1.7;
    pf.state='idle'; pf.move=null;
    pf.x=0; pf.y=0; pf.facing=1;
    ctx.save();
    ctx.translate(x+CARD_W/2, y+190);
    ctx.scale(0.94, 0.94);
    drawFighter(pf);
    ctx.restore();
    ctx.textAlign='center';
    ctx.font='bold 13px "Courier New",monospace';
    ctx.fillStyle='#fff';
    ctx.fillText(ch.name, x+CARD_W/2, y+208);
    ctx.font='bold 10px "Courier New",monospace';
    ctx.fillStyle='rgba(255,255,255,0.45)';
    ctx.fillText(ch.tag, x+CARD_W/2, y+224);
    for (let k=0;k<4;k++){
      ctx.fillStyle = ch.skills[k].color;
      ctx.globalAlpha = 0.85;
      ctx.fillRect(x+12+k*26, y+CARD_H-14, 20, 5);
      ctx.globalAlpha = 1;
    }
    if (isP1){
      ctx.font='bold 12px "Courier New",monospace';
      ctx.fillStyle='#5fb8ff';
      ctx.fillText(sel.lock1 ? '◆ 1P 已确认' : '1P', x+CARD_W/2, y-8);
    }
    if (isP2){
      ctx.font='bold 12px "Courier New",monospace';
      ctx.fillStyle='#ff5a5a';
      ctx.fillText(sel.lock2 ? '◆ 2P 已确认' : (mode==='pve'?'CPU':'2P'),
                   x+CARD_W/2, y+CARD_H+18);
    }
  }
  ctx.textAlign='center';
  ctx.font='bold 12px "Courier New",monospace';
  ctx.fillStyle='rgba(95,184,255,0.85)';
  ctx.fillText('1P: A/D 选择   J 确认   K 取消', 260, 500);
  if (mode==='pvp'){
    ctx.fillStyle='rgba(255,90,90,0.85)';
    ctx.fillText('2P: ←/→ 选择   小键盘 1 确认   2 取消', 700, 500);
  } else {
    ctx.fillStyle='rgba(255,90,90,0.6)';
    ctx.fillText('2P: 电脑自动选择', 700, 500);
  }
  if (sel.lock1 && sel.lock2){
    ctx.save();
    ctx.globalAlpha = 0.6 + 0.4*Math.abs(Math.sin(time*8));
    ctx.font='bold 36px "Courier New",monospace';
    ctx.fillStyle='#ffd93b';
    ctx.fillText('战 斗 开 始', W/2, 490);
    ctx.restore();
  }
}
function drawTitle(){
  ctx.fillStyle='rgba(3,6,14,0.88)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.save();
  ctx.shadowBlur=34; ctx.shadowColor='#ff8c1a';
  ctx.fillStyle='#ffd93b'; ctx.font='bold 68px "Courier New",monospace';
  ctx.fillText('像 素 火 影', W/2, 176);
  ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.75)';
  ctx.font='bold 17px "Courier New",monospace';
  ctx.fillText('N I N J A   D U E L   ·   8  忍者', W/2, 216);
  const optY=[286, 350];
  const opts=[
    {key:'1', label:'双 人 对 战', sub:'1P 键盘左区  vs  2P 方向键 + 小键盘', col:'#ffd93b'},
    {key:'2', label:'人 机 对 战', sub:'1P 键盘左区  vs  电脑 AI',            col:'#8fd3ff'}
  ];
  for (let i=0;i<opts.length;i++){
    const o=opts[i], y=optY[i];
    ctx.save();
    ctx.strokeStyle=o.col; ctx.lineWidth=2;
    ctx.globalAlpha = 0.35 + 0.25*Math.sin(time*3+i);
    rrect(W/2-250, y-38, 500, 62, 10); ctx.stroke();
    ctx.restore();
    ctx.font='bold 26px "Courier New",monospace';
    ctx.fillStyle=o.col;
    ctx.fillText(`[ ${o.key} ]   ${o.label}`, W/2, y-2);
    ctx.font='bold 12px "Courier New",monospace';
    ctx.fillStyle='rgba(255,255,255,0.45)';
    ctx.fillText(o.sub, W/2, y+18);
  }
  ctx.font='bold 12px "Courier New",monospace';
  ctx.fillStyle='rgba(255,255,255,0.30)';
  ctx.fillText('按 1 或 2 选择模式   ·   点击屏幕也可开始', W/2, 452);
  ctx.font='bold 10px "Courier New",monospace';
  ctx.fillStyle='rgba(255,255,255,0.22)';
  ctx.fillText('1P: A D 移动  W 跳  S 防御  J 普攻  K/L/I 技能  U 奥义', W/2, 492);
  ctx.fillText('2P: ← → 移动  ↑ 跳  ↓ 防御  小键盘 1/2/3/4 技能  0 奥义', W/2, 512);
}
function drawOverlay(){
  if (gameState !== 'over') return;
  ctx.fillStyle='rgba(3,6,14,0.74)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  const col = winnerText.includes('1P') ? '#5fb8ff' :
              winnerText.includes('2P') ? '#ff5a5a' : '#e63946';
  ctx.save();
  ctx.shadowBlur=32; ctx.shadowColor=col;
  ctx.font='bold 76px "Courier New",monospace';
  ctx.fillStyle=col;
  ctx.fillText(winnerText, W/2, H/2-10);
  ctx.restore();
  if (stateTimer > 1.0){
    ctx.globalAlpha = 0.4 + 0.6*Math.abs(Math.sin(time*3));
    ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.font='bold 18px "Courier New",monospace';
    ctx.fillText('按 空格 键 再 战', W/2, H/2+66);
    ctx.globalAlpha = 1;
  }
}

/* ═══════════════════════════════════════════════════════
   流程
   ═══════════════════════════════════════════════════════ */
function startMode(m){
  resumeAudio();
  mode=m; gameState='select'; stateTimer=0;
  sel.p1=0; sel.p2=1;
  sel.lock1=false; sel.lock2=false;
  sel.cpuTimer=0; sel.goTimer=0;
}
function startFight(){
  const c1=CHARACTERS[sel.p1];
  const c2=CHARACTERS[sel.p2];
  p1 = new Fighter({char:c1, isPlayer:true, pIndex:1, x:290, facing:1});
  p2 = new Fighter({char:c2, isPlayer:mode==='pvp', pIndex:2, x:670, facing:-1});
  p1.auraOn = true;
  p2.auraOn = true;
  particles=[]; texts=[]; clones=[]; projectiles=[]; hazards=[]; decos=[];
  hitStop=0; shake=0; flashScreen=0;
  roundBanner=1.2; gameState='fight'; stateTimer=0;
  for (let i=0;i<50;i++){
    particles.push({x:290+rand(-60,60), y:GROUND-rand(0,120),
      vx:rand(-130,130), vy:rand(-360,-80),
      life:rand(0.4,0.9), maxLife:0.9, size:rand(2,6), color:'#5fb8ff', grav:500});
    particles.push({x:670+rand(-60,60), y:GROUND-rand(0,120),
      vx:rand(-130,130), vy:rand(-360,-80),
      life:rand(0.4,0.9), maxLife:0.9, size:rand(2,6), color:'#ff5a5a', grav:500});
  }
  SFX.ultBoom();
}
function updateSelect(dt){
  if (!sel.lock1){
    if (pressed[1].left)  sel.p1 = (sel.p1+CHARACTERS.length-1)%CHARACTERS.length;
    if (pressed[1].right) sel.p1 = (sel.p1+1)%CHARACTERS.length;
    if (pressed[1].up)    sel.p1 = (sel.p1+CHARACTERS.length-4)%CHARACTERS.length;
    if (pressed[1].down)  sel.p1 = (sel.p1+4)%CHARACTERS.length;
    if (pressed[1].atk)   sel.lock1 = true;
  } else if (pressed[1].s1) sel.lock1 = false;
  if (mode === 'pvp'){
    if (!sel.lock2){
      if (pressed[2].left)  sel.p2 = (sel.p2+CHARACTERS.length-1)%CHARACTERS.length;
      if (pressed[2].right) sel.p2 = (sel.p2+1)%CHARACTERS.length;
      if (pressed[2].up)    sel.p2 = (sel.p2+CHARACTERS.length-4)%CHARACTERS.length;
      if (pressed[2].down)  sel.p2 = (sel.p2+4)%CHARACTERS.length;
      if (pressed[2].atk)   sel.lock2 = true;
    } else if (pressed[2].s1) sel.lock2 = false;
  } else {
    if (!sel.lock2){
      sel.cpuTimer += dt;
      if (sel.cpuTimer > 0.25){
        sel.cpuTimer = 0;
        sel.p2 = Math.floor(Math.random()*CHARACTERS.length);
        if (Math.random() < 0.5) sel.lock2 = true;
      }
    }
  }
  if (sel.lock1 && sel.lock2){
    sel.goTimer += dt;
    if (sel.goTimer > 0.9) startFight();
  } else sel.goTimer = 0;
}
function updateFight(dt){
  if (hitStop > 0){
    hitStop -= dt;
    updateParticles(dt*0.15);
    if (shake > 0) shake = Math.max(0, shake - dt*60);
    if (flashScreen > 0) flashScreen = Math.max(0, flashScreen - dt*4);
    return;
  }
  updateSfxCd(dt);
  handleInput(p1, input[1], buffer[1], dt);
  if (mode === 'pvp') handleInput(p2, input[2], buffer[2], dt);
  else                updateAI(p2, p1, dt);

  p1.update(dt, p2);
  p2.update(dt, p1);

  const dx = p2.x - p1.x;
  const minD = 48;
  if (Math.abs(dx) < minD && p1.move===null && p2.move===null){
    const push = (minD-Math.abs(dx))/2 * (Math.sign(dx)||1);
    p2.x += push; p1.x -= push;
    p1.x = clamp(p1.x, 62, W-62);
    p2.x = clamp(p2.x, 62, W-62);
  }

  updateParticles(dt);
  resolveProjectiles();
  resolveClones();
  resolveHazards(dt);

  if (shake > 0) shake = Math.max(0, shake - dt*60);
  if (flashScreen > 0) flashScreen = Math.max(0, flashScreen - dt*4);
  if (roundBanner > 0) roundBanner -= dt;

  if (p2.hp <= 0 && p1.hp <= 0){
    winnerText='双 方 平 局'; gameState='over'; stateTimer=0;
  } else if (p2.hp <= 0){
    winnerText = mode === 'pve' ? '你 赢 了' : '1P  胜 利';
    gameState='over'; stateTimer=0;
  } else if (p1.hp <= 0){
    winnerText = mode === 'pve' ? '你 输 了' : '2P  胜 利';
    gameState='over'; stateTimer=0;
  }
}
function update(dt){
  time += dt; stateTimer += dt;
  for (const pi of [1,2]) for (const a of ACTIONS){
    if (buffer[pi][a] > 0) buffer[pi][a] = Math.max(0, buffer[pi][a]-dt);
  }
  switch (gameState){
    case 'title':  break;
    case 'select': updateSelect(dt); break;
    case 'fight':  updateFight(dt);  break;
    case 'over':
      updateParticles(dt);
      if (p1) p1.update(dt, p2);
      if (p2) p2.update(dt, p1);
      if (shake > 0) shake = Math.max(0, shake - dt*60);
      if (flashScreen > 0) flashScreen = Math.max(0, flashScreen - dt*4);
      break;
  }
}

function render(){
  ctx.clearRect(0,0,W,H);
  if (gameState === 'title'){ drawBackground(); drawTitle(); return; }
  if (gameState === 'select'){ drawSelectScreen(); return; }

  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake,shake), rand(-shake,shake));

  drawBackground();
  drawShadows();
  drawClones();

  const list = [p1, p2].filter(Boolean).sort((a,b)=> a.y - b.y);
  for (const f of list) drawFighter(f);

  drawHazards();
  drawDecos();
  drawParticles();
  drawProjectiles();
  drawTexts();

  ctx.restore();

  if (flashScreen > 0){
    ctx.fillStyle = `rgba(255,180,60,${flashScreen*0.42})`;
    ctx.fillRect(0,0,W,H);
  }

  if (gameState === 'fight'){
    drawHUD();
    if (roundBanner > 0){
      const a = clamp(roundBanner/1.2, 0, 1);
      ctx.save();
      ctx.globalAlpha = Math.min(1, a*2.2);
      ctx.textAlign='center';
      ctx.font='bold 54px "Courier New",monospace';
      ctx.lineWidth = 8; ctx.strokeStyle='rgba(0,0,0,0.8)';
      ctx.strokeText('战 斗 开 始', W/2, 220);
      ctx.fillStyle='#ffd93b';
      ctx.fillText('战 斗 开 始', W/2, 220);
      ctx.restore();
    }
  }
  drawOverlay();
}

/* ═══════════════════════════════════════════════════════
   事件（首次交互解锁音频）
   ═══════════════════════════════════════════════════════ */
window.addEventListener('keydown', e=>{
  resumeAudio();
  const code = e.code;
  if (code.startsWith('Arrow') || code.startsWith('Numpad') || code === 'Space'){
    e.preventDefault();
  }
  if (gameState === 'title'){
    if (code === 'Digit1'){ startMode('pvp'); return; }
    if (code === 'Digit2'){ startMode('pve'); return; }
    return;
  }
  if (gameState === 'over'){
    if (stateTimer > 1.0 && (code === 'Space' || code === 'Enter')) startMode(mode);
    return;
  }
  const m = KEYMAP[code];
  if (!m) return;
  const [pi, act] = m;
  if (!input[pi][act]){
    pressed[pi][act] = true;
    buffer[pi][act] = BUFFER_TIME;
  }
  input[pi][act] = true;
});
window.addEventListener('keyup', e=>{
  const m = KEYMAP[e.code];
  if (!m) return;
  e.preventDefault();
  const [pi, act] = m;
  input[pi][act] = false;
});
window.addEventListener('blur', ()=>{
  for (const pi of [1,2]) for (const a of ACTIONS){
    input[pi][a]=false; pressed[pi][a]=false; buffer[pi][a]=0;
  }
});
cvs.addEventListener('pointerdown', e=>{
  e.preventDefault();
  resumeAudio();
  if (gameState === 'title'){
    const r = cvs.getBoundingClientRect();
    const y = (e.clientY - r.top)/r.height * H;
    if (y > 240 && y < 322) startMode('pvp');
    else if (y > 304 && y < 386) startMode('pve');
    else startMode('pvp');
  } else if (gameState === 'over' && stateTimer > 1.0){
    startMode(mode);
  }
});
document.addEventListener('touchmove', e=>e.preventDefault(), {passive:false});
document.addEventListener('gesturestart', e=>e.preventDefault());
document.addEventListener('click', resumeAudio);

let lastT = performance.now();
function loop(now){
  let dt = (now - lastT)/1000;
  lastT = now;
  dt = Math.min(dt, 0.045);
  update(dt);
  render();
  for (const pi of [1,2]) for (const a of ACTIONS) pressed[pi][a] = false;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
